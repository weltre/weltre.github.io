<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>JSON Board v1.1</title>
    <link rel="stylesheet" href="common.css">
    <style>
        .post-card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 12px; margin-bottom: 15px; cursor: pointer; transition: 0.3s; }
        .post-card:hover { border-color: var(--point); transform: translateY(-3px); box-shadow: var(--neon-shadow); }
        .post-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.85em; color: var(--point); }
        .post-title { font-size: 1.2em; font-weight: bold; color: var(--text); }
        #editor-ui { display: none; background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid var(--sub); }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-bar">
            <h1 style="color:var(--point); margin:0;">📋 JSON BOARD</h1>
            <div>
                <button class="btn btn-blue" onclick="showList()">목록</button>
                <button class="btn btn-orange" onclick="showEditor()">글쓰기</button>
                <button class="btn btn-red" onclick="saveData()">DB 저장</button>
            </div>
        </div>

        <div id="list-ui" style="overflow-y: auto; flex-grow: 1;">
            <div id="post-container"></div>
        </div>

        <div id="view-ui" style="display:none; overflow-y: auto; flex-grow: 1;">
            <div id="view-content" class="opt-edit-card"></div>
            <button class="game-btn" onclick="showList()" style="margin-top:20px;">뒤로 가기</button>
        </div>

        <div id="editor-ui">
            <label>제목</label>
            <input type="text" id="post-title-in">
            <label>내용</label>
            <textarea id="post-content-in" rows="10"></textarea>
            <div class="grid-3" style="margin-top:20px;">
                <button class="btn btn-blue" style="grid-column: span 2;" onclick="addPost()">등록하기</button>
                <button class="btn btn-red" onclick="showList()">취소</button>
            </div>
        </div>
        
        <input type="file" id="db-loader" accept=".json" style="display:none" onchange="loadData(event)">
        <button class="game-btn" onclick="document.getElementById('db-loader').click()" style="margin-top:20px; border-left-color: var(--sub);">📂 DB 파일 불러오기</button>
    </div>

<script>
    let db = { posts: [] };

    // 최초 실행 시 빈 목록 렌더링
    window.onload = () => { renderList(); };

    function renderList() {
        showList();
        const container = document.getElementById('post-container');
        container.innerHTML = db.posts.length ? '' : '<p style="text-align:center; opacity:0.5;">파일을 불러오거나 새 글을 작성하세요.</p>';
        
        [...db.posts].reverse().forEach((post, index) => {
            const realIdx = db.posts.length - 1 - index;
            const card = document.createElement('div');
            card.className = 'post-card';
            card.innerHTML = `<div class="post-header"><span>#${realIdx + 1}</span><span>${post.date}</span></div>
                              <div class="post-title">${post.title}</div>`;
            card.onclick = () => viewPost(realIdx);
            container.appendChild(card);
        });
    }

    function addPost() {
        const title = document.getElementById('post-title-in').value;
        const content = document.getElementById('post-content-in').value;
        if(!title || !content) return;

        db.posts.push({ title, content, date: new Date().toLocaleString() });
        document.getElementById('post-title-in').value = '';
        document.getElementById('post-content-in').value = '';
        renderList();
    }

    function viewPost(idx) {
        const post = db.posts[idx];
        document.getElementById('list-ui').style.display = 'none';
        document.getElementById('view-ui').style.display = 'block';
        document.getElementById('view-content').innerHTML = `
            <h2 style="color:var(--point); margin:0;">${post.title}</h2>
            <p style="font-size:0.8em; color:var(--sub); opacity:0.7;">${post.date}</p>
            <hr style="border:0; border-top:1px solid var(--border); margin:20px 0;">
            <div style="white-space:pre-wrap;">${post.content}</div>
            <div style="margin-top:30px; text-align:right;"><button class="btn btn-red" onclick="deletePost(${idx})">삭제</button></div>`;
    }

    function deletePost(idx) {
        db.posts.splice(idx, 1);
        renderList();
    }

    function loadData(e) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            db = JSON.parse(ev.target.result);
            renderList();
        };
        reader.readAsText(e.target.files[0]);
    }

    function saveData() {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify(db, null, 2)], {type: "application/json"}));
        a.download = "board_db.json";
        a.click();
    }

    function showList() { document.getElementById('list-ui').style.display = 'block'; document.getElementById('editor-ui').style.display = 'none'; document.getElementById('view-ui').style.display = 'none'; }
    function showEditor() { document.getElementById('list-ui').style.display = 'none'; document.getElementById('view-ui').style.display = 'none'; document.getElementById('editor-ui').style.display = 'block'; }
</script>
</body>
</html>
