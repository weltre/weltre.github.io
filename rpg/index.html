<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Text Adventure Engine - Debugged</title>
    <style>
        body { background: #0f0f0f; color: #f5f5f5; font-family: 'Malgun Gothic', sans-serif; display: flex; justify-content: center; padding: 20px; margin: 0; }
        #game-window { max-width: 650px; width: 100%; margin-top: 20px; }
        #status-bar { display: flex; flex-wrap: wrap; gap: 15px; background: #1a1a1a; padding: 15px; border-radius: 10px; border: 1px solid #333; margin-bottom: 20px; }
        #inventory-bar { color: #dcdde1; font-size: 0.9em; width: 100%; border-top: 1px solid #333; margin-top: 10px; padding-top: 10px; }
        .scene-card { background: #1a1a1a; padding: 25px; border-radius: 12px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .scene-img { width: 100%; border-radius: 8px; margin-bottom: 20px; max-height: 400px; object-fit: cover; border: 1px solid #444; }
        .text-box { line-height: 1.8; margin-bottom: 30px; white-space: pre-wrap; font-size: 1.15em; color: #ecf0f1; }
        .btn { display: block; width: 100%; padding: 14px; margin: 12px 0; background: #2c3e50; color: white; border: 1px solid #34495e; border-radius: 8px; cursor: pointer; text-align: left; transition: 0.2s; font-size: 1em; }
        .btn:hover { background: #34495e; border-color: #0097e6; transform: translateX(5px); }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="game-window">
        <div id="loader" class="scene-card" style="text-align: center;">
            <h2 style="color:#0097e6">시나리오 파일을 업로드하세요</h2>
            <input type="file" id="game-file" accept=".json" style="margin-top:20px;">
        </div>

        <div id="game-ui" class="hidden">
            <div id="status-bar"></div>
            <div class="scene-card">
                <img id="scene-image" class="scene-img" onerror="this.style.display='none'">
                <div id="scene-text" class="text-box"></div>
                <div id="options-box"></div>
            </div>
        </div>
    </div>

<script>
    let scenario = null;
    let gameState = { stats: {}, inventory: {} };

    document.getElementById('game-file').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                scenario = JSON.parse(ev.target.result);
                startGame();
            } catch(err) { alert("시나리오 파일 형식이 잘못되었습니다."); }
        };
        reader.readAsText(e.target.files[0]);
    };

    function startGame() {
        scenario.config.stats.forEach(s => gameState.stats[s.key] = s.initial);
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('game-ui').classList.remove('hidden');
        renderNode(scenario.config.startNode);
    }

    function renderNode(nodeId) {
        const node = scenario.scenes[nodeId];
        if(!node) { alert("장면을 찾을 수 없습니다: " + nodeId); return; }

        const img = document.getElementById('scene-image');
        const text = document.getElementById('scene-text');
        const opts = document.getElementById('options-box');

        updateUI();

        // 이미지 처리
        if(node.image) { img.src = node.image; img.style.display = 'block'; }
        else { img.style.display = 'none'; }
        
        text.innerText = node.text;
        opts.innerHTML = '';

        node.options.forEach(opt => {
            // 조건 필터링
            if(opt.chance && Math.random() * 100 > opt.chance) return;
            if(opt.requireItem && !gameState.inventory[opt.requireItem]) return;

            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = opt.text || "(선택지 텍스트 없음)";
            btn.onclick = () => {
                // 수치 변화
                if(opt.effects) {
                    Object.keys(opt.effects).forEach(k => {
                        if(gameState.stats.hasOwnProperty(k)) gameState.stats[k] += opt.effects[k];
                    });
                }
                // 아이템 처리
                if(opt.getItem) changeItem(opt.getItem, 1);
                if(opt.useItem) changeItem(opt.useItem, -1);
                
                renderNode(opt.next || nodeId);
            };
            opts.appendChild(btn);
        });
    }

    function changeItem(name, amount) {
        if(!name) return;
        gameState.inventory[name] = (gameState.inventory[name] || 0) + amount;
        if(gameState.inventory[name] <= 0) delete gameState.inventory[name];
    }

    function updateUI() {
        const bar = document.getElementById('status-bar');
        const statsStr = scenario.config.stats.map(s => `<span>${s.label}: <b>${gameState.stats[s.key]}</b></span>`).join('');
        const invStr = `<div id="inventory-bar">🎒 소지품: ${Object.keys(gameState.inventory).join(', ') || '비어 있음'}</div>`;
        bar.innerHTML = statsStr + invStr;
    }
</script>
</body>
</html>
