
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Text Adventure Player</title>
    <link rel="stylesheet" href="common.css">
    <style>
        .container { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
        #status-bar { display: flex; gap: 20px; margin-bottom: 10px; font-weight: bold; color: var(--orange); }
        #inventory-bar { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; margin-bottom: 25px; border: 1px solid #333; font-size: 0.9em; }
        #scene-text { font-size: 1.25em; line-height: 1.8; min-height: 180px; white-space: pre-wrap; margin-bottom: 40px; }
        .game-btn { 
            display: block; width: 100%; padding: 18px; margin: 12px 0; 
            background: var(--btn); color: var(--text); border: 1px solid #444; 
            border-radius: 12px; cursor: pointer; text-align: left; 
            opacity: 0; transition: 0.5s ease; font-size: 1.05em;
        }
        .game-btn.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="container">
        <div id="load-screen">
            <h1>🎮 게임 시작</h1>
            <p>시나리오 JSON 파일을 불러오세요.</p>
            <input type="file" id="loader" accept=".json">
        </div>

        <div id="game-ui" style="display:none">
            <div id="status-bar"></div>
            <div id="inventory-bar">🎒 소지품: 없음</div>
            <div id="scene-text"></div>
            <div id="options-box"></div>
        </div>
    </div>

    <div id="msg-box">
        <h2 id="msg-title">알림</h2>
        <div id="msg-content"></div>
        <button onclick="closeMsg()">확인</button>
    </div>

<script>
    let scenario, state = { stats: {}, inventory: new Set(), nextNode: null };

    document.getElementById('loader').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
            scenario = JSON.parse(ev.target.result);
            document.getElementById('load-screen').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            initGame();
        };
        reader.readAsText(e.target.files[0]);
    };

    function initGame() {
        scenario.config.stats.forEach(s => state.stats[s.key] = s.initial);
        renderNode(scenario.config.startNode);
    }

    function showMsg(text, next = null) {
        document.getElementById('msg-content').innerText = text;
        document.getElementById('msg-box').style.display = 'block';
        state.nextNode = next;
    }

    function closeMsg() {
        document.getElementById('msg-box').style.display = 'none';
        if(state.nextNode) renderNode(state.nextNode);
    }

    function renderNode(nodeId) {
        const node = scenario.scenes[nodeId];
        
        // 자동 이벤트 체크 (사망 등 스탯 0 체크)
        if(node.autoEvents) {
            for(let ev of node.autoEvents) {
                if(state.stats[ev.statKey] < ev.threshold && Math.random()*100 <= ev.chance) {
                    return showMsg(ev.message, ev.next);
                }
            }
        }

        // UI 업데이트
        document.getElementById('status-bar').innerHTML = scenario.config.stats.map(s => `${s.label}: ${state.stats[s.key]}`).join(' | ');
        document.getElementById('inventory-bar').innerText = "🎒 소지품: " + (state.inventory.size ? Array.from(state.inventory).join(', ') : "없음");
        
        const box = document.getElementById('options-box');
        box.innerHTML = '';
        
        // 타이핑 효과
        const textEl = document.getElementById('scene-text');
        textEl.innerText = "";
        let i = 0;
        function type() {
            if (i < node.text.length) {
                textEl.innerText += node.text.charAt(i++);
                setTimeout(type, 30);
            } else {
                renderOptions(node.options);
            }
        }
        type();
    }

    function renderOptions(options) {
        const box = document.getElementById('options-box');
        options.forEach(opt => {
            if(opt.requireItem && !state.inventory.has(opt.requireItem)) return;
            
            const btn = document.createElement('button');
            btn.className = 'game-btn';
            btn.innerText = opt.text;
            btn.onclick = () => {
                if(opt.effects) Object.keys(opt.effects).forEach(k => state.stats[k] += opt.effects[k]);
                if(opt.getItem) state.inventory.add(opt.getItem);
                
                // 확률 결과 처리
                if(opt.results && opt.results.length > 0) {
                    let roll = Math.random()*100, acc = 0, res = opt.results[0];
                    for(let r of opt.results) { acc += r.chance; if(roll <= acc) { res = r; break; } }
                    if(res.effects) Object.keys(res.effects).forEach(k => state.stats[k] += res.effects[k]);
                    showMsg(res.message, res.next);
                } else {
                    renderNode(opt.next);
                }
            };
            box.appendChild(btn);
            setTimeout(() => btn.classList.add('show'), 50);
        });
    }
</script>
</body>
</html>
