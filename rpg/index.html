<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title id="p-title-tab">Adventure Player v5.3</title>
    <link rel="stylesheet" href="common.css">
    <style>
        #status-bar { display: flex; gap: 20px; padding-bottom: 10px; border-bottom: 2px solid var(--point); margin-bottom: 15px; font-weight: bold; }
        #inventory-bar { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; margin-bottom: 25px; border-left: 5px solid var(--sub); } /* 인벤토리는 서브색 */
        #scene-text { font-size: 1.25em; line-height: 1.8; min-height: 180px; white-space: pre-wrap; margin-bottom: 40px; }
        .game-btn { display: block; width: 100%; padding: 18px; margin: 12px 0; background: var(--card); color: var(--text); border: 1px solid #444; border-left: 4px solid var(--point); border-radius: 8px; cursor: pointer; text-align: left; transition: 0.3s; }
        .game-btn:hover:not(:disabled) { border-color: var(--sub); } /* 호버 시 서브색 강조 */
        .game-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        #msg-box { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 450px; background: var(--card); border: 3px solid var(--sub); padding: 30px; border-radius: 15px; z-index: 2000; text-align: center; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div id="game-ui" style="display:none">
            <div id="status-bar" class="theme-text"></div>
            <div id="inventory-bar" class="sub-text">🎒 소지품: 없음</div>
            <div id="scene-text"></div>
            <div id="options-box"></div>
        </div>
    </div>
    <div id="msg-box">
        <h2 id="msg-title" class="sub-text">알림</h2>
        <div id="msg-content"></div>
        <button onclick="closeMsg()" class="sub-bg" style="width:100%; padding:10px; color:white; border:none; border-radius:5px; margin-top:20px; cursor:pointer;">확인</button>
    </div>

<script>
    let scenario, state = { stats: {}, inventory: new Set(), clickCounts: {}, nextNode: null };
    document.body.insertAdjacentHTML('afterbegin', '<div id="load-screen" class="container"><h1>🎮 Adventure Player</h1><input type="file" id="loader" accept=".json"></div>');

    document.getElementById('loader').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
            scenario = JSON.parse(ev.target.result);
            applyConfig();
            document.getElementById('load-screen').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            initGame();
        };
        reader.readAsText(e.target.files[0]);
    };

    function applyConfig() {
        if(!scenario.config) return;
        if(scenario.config.themeColor) document.documentElement.style.setProperty('--point', scenario.config.themeColor);
        if(scenario.config.subColor) document.documentElement.style.setProperty('--sub', scenario.config.subColor);
    }

    function initGame() {
        state.inventory = new Set(); state.clickCounts = {};
        scenario.config.stats.forEach(s => state.stats[s.key] = s.initial);
        renderNode(scenario.config.startNode);
    }

    function renderNode(nodeId) {
        const node = scenario.scenes[nodeId];
        if(!node) return;
        updateUI();
        document.getElementById('scene-text').innerText = node.text;
        const box = document.getElementById('options-box'); box.innerHTML = '';
        node.options.forEach((opt, idx) => {
            if(opt.requireItem && !state.inventory.has(opt.requireItem)) return;
            if(opt.maxClicks && (state.clickCounts[`${nodeId}_${idx}`] || 0) >= opt.maxClicks) return;
            const btn = document.createElement('button');
            btn.className = 'game-btn';
            btn.innerText = opt.text;
            btn.onclick = () => {
                state.clickCounts[`${nodeId}_${idx}`] = (state.clickCounts[`${nodeId}_${idx}`] || 0) + 1;
                if(opt.effects) applyEffects(opt.effects);
                if(opt.getItem) state.inventory.add(opt.getItem);
                if(opt.results && opt.results.length > 0) {
                    let roll = Math.random()*100, acc = 0, res = opt.results[0];
                    for(let r of opt.results) { acc += r.chance; if(roll <= acc) { res = r; break; } }
                    if(res.effects) applyEffects(res.effects);
                    showMsg(res.message, res.next || nodeId);
                } else { renderNode(opt.next || nodeId); }
            };
            box.appendChild(btn);
        });
    }

    function applyEffects(eff) {
        Object.keys(eff).forEach(k => { state.stats[k] = Math.max(0, state.stats[k] + eff[k]); });
        updateUI();
    }

    function updateUI() {
        document.getElementById('status-bar').innerHTML = scenario.config.stats.map(s => `${s.label}: ${state.stats[s.key]}`).join(' | ');
        document.getElementById('inventory-bar').innerText = "🎒 소지품: " + (state.inventory.size ? Array.from(state.inventory).join(', ') : "없음");
    }

    function showMsg(text, next = null) {
        document.getElementById('msg-content').innerText = text;
        document.getElementById('msg-box').style.display = 'block';
        state.nextNode = next;
    }

    function closeMsg() {
        document.getElementById('msg-box').style.display = 'none';
        if(state.nextNode) renderNode(state.nextNode);
    }
</script>
</body>
</html>
