<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>TEXT ENGINE v7.0 - THE FINAL</title>
    <style>
        :root { --bg: #0f1115; --card: #1a1d23; --text: #e0e0e0; --point: #00d2ff; --sub: #ff4757; --border: #333; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Pretendard', system-ui, sans-serif; overflow: hidden; }
        
        /* Layout */
        .app-container { display: flex; flex-direction: column; height: 100vh; }
        nav { background: #15181c; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 15px; height: 55px; gap: 10px; }
        .nav-btn { padding: 0 20px; height: 100%; border: none; background: none; color: #888; font-weight: bold; cursor: pointer; border-bottom: 3px solid transparent; }
        .nav-btn.active { color: var(--point); border-bottom-color: var(--point); background: rgba(0,210,255,0.05); }
        .main-content { flex: 1; display: flex; overflow: hidden; }
        
        /* Views */
        #view-player, #view-maker { display: none; width: 100%; height: 100%; overflow: hidden; }
        
        /* Player UI */
        #view-player { flex-direction: column; padding: 25px; max-width: 900px; margin: 0 auto; }
        .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 15px; }
        #status-bar { display: flex; gap: 20px; color: var(--point); font-weight: bold; font-size: 0.9em; }
        #inv-bar { color: var(--sub); font-size: 0.9em; border-left: 4px solid var(--sub); }
        #scene-display { flex: 1; overflow-y: auto; font-size: 1.15em; line-height: 1.8; white-space: pre-wrap; }
        .choice-btn { width: 100%; padding: 18px; margin-top: 10px; background: #1e2228; border: 1px solid var(--border); border-left: 5px solid var(--point); color: #fff; border-radius: 8px; cursor: pointer; text-align: left; font-size: 1em; transition: 0.2s; }
        .choice-btn:hover:not(:disabled) { transform: translateX(8px); background: #252a33; border-color: var(--point); }
        .choice-btn:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(1); }

        /* Maker UI */
        #view-maker { gap: 0; }
        #node-sidebar { width: 280px; background: #15181c; border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 15px; }
        #editor-pane { flex: 1; overflow-y: auto; padding: 30px; background: #0c0e12; }
        .node-item { padding: 12px; background: var(--card); border: 1px solid var(--border); margin-bottom: 8px; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .node-item.active { border-color: var(--point); background: rgba(0,210,255,0.1); }
        
        /* Forms */
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; margin-top: 10px; }
        input, textarea, select { width: 100%; background: #000; color: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-family: inherit; }
        .row { display: flex; gap: 10px; }
        .btn { padding: 10px 18px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
        .btn-blue { background: var(--point); color: #000; }
        .btn-orange { background: var(--sub); color: #000; }
        .btn-red { background: #ff4757; color: #fff; }

        /* Modal */
        #modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 1000; }
        #modal-box { background: var(--card); border: 2px solid var(--sub); padding: 30px; border-radius: 15px; width: 450px; text-align: center; }
    </style>
</head>
<body>

<div class="app-container">
    <nav>
        <div style="font-weight: bold; color: var(--point); margin-right: 20px;">v7.0 FINAL</div>
        <button class="nav-btn active" data-tab="player">PLAY</button>
        <button class="nav-btn" data-tab="maker">MAKER</button>
        <div style="flex: 1;"></div>
        <input type="file" id="json-loader" hidden onchange="Game.load(event)">
        <button class="btn btn-orange" onclick="document.getElementById('json-loader').click()">📂 LOAD</button>
        <button class="btn btn-orange" onclick="Game.download()">💾 SAVE</button>
    </nav>

    <div class="main-content">
        <div id="view-player">
            <div class="panel" id="status-bar"></div>
            <div class="panel" id="inv-bar">🎒 소지품: 없음</div>
            <div id="scene-display" class="panel">시나리오를 불러와 주세요.</div>
            <div id="choice-container"></div>
        </div>

        <div id="view-maker">
            <div id="node-sidebar">
                <button class="btn btn-blue" onclick="Maker.addNode()" style="margin-bottom: 15px;">+ NEW NODE</button>
                <div id="node-list-container" style="overflow-y: auto;"></div>
            </div>
            <div id="editor-pane">
                <div class="card">
                    <b style="color: var(--point)">GLOBAL CONFIG</b>
                    <div class="row">
                        <div style="flex: 2;"><label>게임 제목</label><input id="m-title" oninput="Game.data.config.title=this.value"></div>
                        <div style="flex: 1;"><label>메인 컬러</label><input type="color" id="m-color1" oninput="Maker.updateTheme('themeColor', this.value)"></div>
                        <div style="flex: 1;"><label>서브 컬러</label><input type="color" id="m-color2" oninput="Maker.updateTheme('subColor', this.value)"></div>
                    </div>
                    <div id="m-stat-list"></div>
                    <button class="btn btn-blue" onclick="Maker.addStat()" style="margin-top: 10px;">+ STAT ADD</button>
                </div>

                <div id="node-editor" style="display: none;">
                    <div class="card" style="border-left: 5px solid var(--point);">
                        <div class="row">
                            <div style="flex: 1;"><label>Node ID</label><input id="m-node-id" onblur="Maker.renameNode(this.value)"></div>
                            <div style="display: flex; align-items: flex-end; gap: 5px;">
                                <button class="btn btn-orange" onclick="Maker.addAuto()">+ AUTO EVENT</button>
                                <button class="btn btn-blue" onclick="Maker.addOption()">+ OPTION</button>
                                <button class="btn btn-red" onclick="Maker.deleteNode()">DELETE</button>
                            </div>
                        </div>
                        <label>지문(Scene Text)</label>
                        <textarea id="m-node-text" rows="5" oninput="Maker.updateNodeText(this.value)"></textarea>
                    </div>
                    <div id="m-auto-list"></div>
                    <div id="m-opt-list"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="modal-overlay">
    <div id="modal-box">
        <div id="modal-text" style="margin-bottom: 25px; line-height: 1.6; font-size: 1.1em;"></div>
        <button class="btn btn-blue" style="width: 100%; padding: 15px;" onclick="Game.closeModal()">확인</button>
    </div>
</div>

<script>
/* ==========================================================================
   CORE GAME ENGINE (Encapsulated)
   ========================================================================== */
const Game = {
    data: {
        config: { title: "New Game", themeColor: "#00d2ff", subColor: "#ff4757", startNode: "start", stats: [] },
        scenes: { "start": { text: "첫 장면입니다.", options: [], autoEvents: [] } }
    },
    state: { stats: {}, inv: new Set(), clicks: {}, nextId: null },

    init() {
        this.state.inv = new Set();
        this.state.clicks = {};
        this.data.config.stats.forEach(s => this.state.stats[s.key] = Number(s.initial) || 0);
        this.render(this.data.config.startNode);
    },

    render(id) {
        const node = this.data.scenes[id];
        if (!node) return console.error("Missing Node:", id);

        // 1. Check Auto Events
        if (node.autoEvents) {
            for (const e of node.autoEvents) {
                if ((this.state.stats[e.statKey] || 0) < (e.threshold || 0)) {
                    this.showModal(e.message, e.next || id);
                    return;
                }
            }
        }

        // 2. UI Updates
        document.getElementById('status-bar').innerHTML = this.data.config.stats.map(s => `<span>${s.label}: ${this.state.stats[s.key]}</span>`).join('');
        document.getElementById('inv-bar').innerText = "🎒 소지품: " + (this.state.inv.size ? [...this.state.inv].join(", ") : "없음");
        document.getElementById('scene-display').innerText = node.text;

        // 3. Render Choices
        const container = document.getElementById('choice-container');
        container.innerHTML = "";
        (node.options || []).forEach((o, i) => {
            const key = `${id}_${i}`;
            if (o.maxClicks && (this.state.clicks[key] || 0) >= o.maxClicks) return;

            const btn = document.createElement('button');
            btn.className = "choice-btn";
            
            // Condition Check
            let canClick = true, missing = [];
            if (o.requireItem) o.requireItem.split(',').forEach(it => {
                const name = it.trim();
                if (name && !this.state.inv.has(name)) { canClick = false; missing.push(name); }
            });

            btn.disabled = !canClick;
            btn.innerText = o.text + (o.maxClicks ? ` (${this.state.clicks[key]||0}/${o.maxClicks})` : "");
            if (!canClick) btn.innerText += ` [필요: ${missing.join(', ')}]`;

            btn.onclick = () => {
                this.state.clicks[key] = (this.state.clicks[key] || 0) + 1;
                if (o.isReset) return this.init();
                
                this.applyEffects(o);
                
                if (o.results && o.results.length > 0) {
                    const total = o.results.reduce((sum, r) => sum + (r.chance || 0), 0);
                    let roll = Math.random() * total, acc = 0, selected = o.results[o.results.length - 1];
                    for (const r of o.results) { acc += r.chance; if (roll <= acc) { selected = r; break; } }
                    this.applyEffects(selected);
                    this.showModal(selected.message, selected.next || o.next || id);
                } else {
                    this.render(o.next || id);
                }
            };
            container.appendChild(btn);
        });
    },

    applyEffects(obj) {
        if (obj.effects) Object.entries(obj.effects).forEach(([k, v]) => this.state.stats[k] = (this.state.stats[k] || 0) + Number(v));
        if (obj.getItem) obj.getItem.split(',').forEach(it => it.trim() && this.state.inv.add(it.trim()));
        if (obj.removeItem) obj.removeItem.split(',').forEach(it => it.trim() && this.state.inv.delete(it.trim()));
    },

    showModal(txt, next) {
        document.getElementById('modal-text').innerText = txt;
        document.getElementById('modal-overlay').style.display = "flex";
        this.state.nextId = next;
    },

    closeModal() {
        document.getElementById('modal-overlay').style.display = "none";
        if (this.state.nextId) this.render(this.state.nextId);
    },

    load(e) {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
            this.data = JSON.parse(ev.target.result);
            Maker.syncUI();
            this.init();
        }; reader.readAsText(file);
    },

    download() {
        const blob = new Blob([JSON.stringify(this.data, null, 2)], { type: "application/json" });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = (this.data.config.title || "scenario") + ".json"; a.click();
    }
};

/* ==========================================================================
   MAKER LOGIC (Scenario Editor)
   ========================================================================== */
const Maker = {
    currId: null,

    syncUI() {
        document.getElementById('m-title').value = Game.data.config.title;
        document.getElementById('m-color1').value = Game.data.config.themeColor;
        document.getElementById('m-color2').value = Game.data.config.subColor;
        document.documentElement.style.setProperty('--point', Game.data.config.themeColor);
        document.documentElement.style.setProperty('--sub', Game.data.config.subColor);
        this.renderNodeList();
        this.renderStats();
    },

    renderNodeList() {
        const cont = document.getElementById('node-list-container');
        cont.innerHTML = "";
        Object.keys(Game.data.scenes).forEach(id => {
            const div = document.createElement('div');
            div.className = `node-item ${this.currId === id ? 'active' : ''}`;
            div.innerText = id;
            div.onclick = () => this.loadNode(id);
            cont.appendChild(div);
        });
    },

    loadNode(id) {
        this.currId = id;
        const node = Game.data.scenes[id];
        document.getElementById('node-editor').style.display = "block";
        document.getElementById('m-node-id').value = id;
        document.getElementById('m-node-text').value = node.text || "";
        this.renderNodeList();
        this.renderOptions();
        this.renderAutos();
    },

    renameNode(newId) {
        if (!newId || newId === this.currId) return;
        const oldId = this.currId;
        Game.data.scenes[newId] = Game.data.scenes[oldId];
        delete Game.data.scenes[oldId];
        
        // Auto-update links
        Object.values(Game.data.scenes).forEach(s => {
            (s.options || []).forEach(o => { 
                if (o.next === oldId) o.next = newId; 
                (o.results || []).forEach(r => { if (r.next === oldId) r.next = newId; });
            });
            (s.autoEvents || []).forEach(a => { if (a.next === oldId) a.next = newId; });
        });
        if (Game.data.config.startNode === oldId) Game.data.config.startNode = newId;
        this.loadNode(newId);
    },

    updateNodeText(val) { Game.data.scenes[this.currId].text = val; },

    addNode() {
        const id = "node_" + Date.now().toString().slice(-4);
        Game.data.scenes[id] = { text: "새 장면입니다.", options: [], autoEvents: [] };
        this.loadNode(id);
    },

    deleteNode() {
        if (Object.keys(Game.data.scenes).length <= 1) return alert("최소 한 개의 장면은 필요합니다.");
        delete Game.data.scenes[this.currId];
        this.loadNode(Object.keys(Game.data.scenes)[0]);
    },

    /* --- Stats --- */
    renderStats() {
        const cont = document.getElementById('m-stat-list'); cont.innerHTML = "";
        Game.data.config.stats.forEach((s, i) => {
            const row = document.createElement('div'); row.className = "row"; row.style.marginTop = "5px";
            row.innerHTML = `<input value="${s.label}" oninput="Game.data.config.stats[${i}].label=this.value">
                             <input value="${s.key}" onblur="Game.data.config.stats[${i}].key=this.value">
                             <input type="number" value="${s.initial}" oninput="Game.data.config.stats[${i}].initial=Number(this.value)">
                             <button class="btn btn-red" onclick="Game.data.config.stats.splice(${i},1); Maker.renderStats();">X</button>`;
            cont.appendChild(row);
        });
    },
    addStat() { Game.data.config.stats.push({ key: "stat_" + Date.now(), label: "신규스탯", initial: 0 }); this.renderStats(); },

    /* --- Options & Results --- */
    renderOptions() {
        const cont = document.getElementById('m-opt-list'); cont.innerHTML = "<b>선택지(Options)</b>";
        const node = Game.data.scenes[this.currId];
        (node.options || []).forEach((o, i) => {
            const card = document.createElement('div'); card.className = "card";
            card.innerHTML = `
                <div class="row"><input value="${o.text}" oninput="Game.data.scenes['${this.currId}'].options[${i}].text=this.value"><label><input type="checkbox" ${o.isReset?'checked':''} onchange="Game.data.scenes['${this.currId}'].options[${i}].isReset=this.checked"> 리셋</label></div>
                <div class="row" style="margin-top:10px;">
                    <input placeholder="다음장면" value="${o.next||''}" oninput="Game.data.scenes['${this.currId}'].options[${i}].next=this.value">
                    <input type="number" placeholder="클릭제한" value="${o.maxClicks||''}" oninput="Game.data.scenes['${this.currId}'].options[${i}].maxClicks=Number(this.value)">
                    <input placeholder="필요템" value="${o.requireItem||''}" oninput="Game.data.scenes['${this.currId}'].options[${i}].requireItem=this.value">
                </div>
                <div id="m-res-area-${i}"></div>
                <div class="row" style="margin-top:10px;">
                    <button class="btn btn-orange" style="flex:1" onclick="Maker.addResult(${i})">+ 확률 결과 추가</button>
                    <button class="btn btn-red" onclick="Game.data.scenes['${this.currId}'].options.splice(${i},1); Maker.renderOptions();">X</button>
                </div>`;
            cont.appendChild(card);
            
            const resArea = card.querySelector(`#m-res-area-${i}`);
            (o.results || []).forEach((r, ri) => {
                const rDiv = document.createElement('div'); rDiv.style = "background:#15181c; padding:10px; border-radius:8px; margin-top:10px; border: 1px dashed #555;";
                rDiv.innerHTML = `
                    <div class="row"><input type="number" style="width:70px" value="${r.chance}" oninput="Game.data.scenes['${this.currId}'].options[${i}].results[${ri}].chance=Number(this.value)">% 확률로 <input placeholder="이동ID" value="${r.next||''}" oninput="Game.data.scenes['${this.currId}'].options[${i}].results[${ri}].next=this.value"> 이동</div>
                    <textarea style="margin-top:5px; height:50px;" oninput="Game.data.scenes['${this.currId}'].options[${i}].results[${ri}].message=this.value" placeholder="결과 메시지">${r.message||''}</textarea>
                    <button class="btn btn-red" style="width:100%; margin-top:5px; padding:2px;" onclick="Game.data.scenes['${this.currId}'].options[${i}].results.splice(${ri},1); Maker.renderOptions();">결과 삭제</button>`;
                resArea.appendChild(rDiv);
            });
        });
    },
    addOption() { Game.data.scenes[this.currId].options.push({ text: "새 선택지", next: "", results: [] }); this.renderOptions(); },
    addResult(i) { Game.data.scenes[this.currId].options[i].results.push({ chance: 50, message: "결과 발생!", next: "" }); this.renderOptions(); },

    /* --- Auto Events --- */
    renderAutos() {
        const cont = document.getElementById('m-auto-list'); cont.innerHTML = "<b>자동 이벤트(Auto Events)</b>";
        const node = Game.data.scenes[this.currId];
        (node.autoEvents || []).forEach((a, i) => {
            const card = document.createElement('div'); card.className = "card"; card.style.borderColor = "var(--sub)";
            card.innerHTML = `
                <div class="row">
                    <select onchange="Game.data.scenes['${this.currId}'].autoEvents[${i}].statKey=this.value">
                        ${Game.data.config.stats.map(s => `<option value="${s.key}" ${s.key===a.statKey?'selected':''}>${s.label}</option>`).join('')}
                    </select>
                    가 <input type="number" value="${a.threshold}" oninput="Game.data.scenes['${this.currId}'].autoEvents[${i}].threshold=Number(this.value)"> 미만일 때
                </div>
                <input placeholder="이동할 Node ID" value="${a.next||''}" oninput="Game.data.scenes['${this.currId}'].autoEvents[${i}].next=this.value" style="margin-top:10px;">
                <textarea style="margin-top:10px;" oninput="Game.data.scenes['${this.currId}'].autoEvents[${i}].message=this.value" placeholder="출력 메시지">${a.message||''}</textarea>
                <button class="btn btn-red" style="width:100%; margin-top:10px;" onclick="Game.data.scenes['${this.currId}'].autoEvents.splice(${i},1); Maker.renderAutos();">자동 이벤트 삭제</button>`;
            cont.appendChild(card);
        });
    },
    addAuto() { Game.data.scenes[this.currId].autoEvents.push({ statKey: Game.data.config.stats[0]?.key, threshold: 0, next: "", message: "사망 혹은 강제 이동!" }); this.renderAutos(); },

    updateTheme(k, v) { Game.data.config[k] = v; this.syncUI(); }
};

/* --- TAB SYSTEM --- */
document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.onclick = () => {
        const tab = btn.dataset.tab;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('view-player').style.display = tab === 'player' ? 'flex' : 'none';
        document.getElementById('view-maker').style.display = tab === 'maker' ? 'flex' : 'none';
        if (tab === 'player') Game.init();
        if (tab === 'maker') Maker.syncUI();
    };
});

// INITIALIZE
document.getElementById('view-player').style.display = 'flex';
Game.init();
</script>
</body>
</html>
