<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>스토리 엔진 Maker / Player</title>
<style>
:root {
  --main:#00d2ff; --sub:#ff4757;
}
body { margin:0; font-family:system-ui; background:#111; color:#eee; }
header { padding:10px; background:#000; display:flex; gap:10px; align-items:center; }
button { padding:6px 12px; border:0; border-radius:4px; cursor:pointer; }
.primary { background:var(--main); color:#000; }
.danger { background:var(--sub); color:#fff; }
input, textarea { width:100%; background:#222; color:#fff; border:1px solid #444; border-radius:4px; padding:4px; }
.card { border:1px solid #333; border-radius:6px; padding:8px; margin-bottom:8px; background:#1a1a1a; }
.card h3 { margin:4px 0; }
.flex { display:flex; gap:6px; flex-wrap:wrap; }
#maker, #player { padding:10px; }
.hidden { display:none; }
.hud { display:flex; gap:10px; background:#000; padding:6px; }
.hud span { padding:4px 8px; background:#222; border-radius:4px; }
.option-btn { display:block; width:100%; margin:4px 0; }
.disabled { opacity:.4; pointer-events:none; }
</style>
</head>
<body>

<header>
  <strong>스토리 엔진</strong>
  <input type="file" id="loadJson" />
  <button class="primary" id="playBtn" disabled>▶ 플레이</button>
  <button class="danger" id="backMaker" class="hidden">Maker로</button>
</header>

<div id="maker"></div>
<div id="player" class="hidden"></div>

<script>
let data=null, errors=[];
let state={};

document.getElementById('loadJson').onchange=e=>{
  const f=e.target.files[0];
  const r=new FileReader();
  r.onload=()=>{
    try{
      data=JSON.parse(r.result);
      validate();
      renderMaker();
    }catch(err){ alert("JSON 오류"); }
  };
  r.readAsText(f);
};

function validate(){
  errors=[];
  if(!data.config?.startNode || !data.scenes[data.config.startNode])
    errors.push("startNode 오류");
  data.config.stats.forEach(s=>{
    if(!s.key) errors.push("스탯 key 누락");
  });
  document.getElementById('playBtn').disabled=errors.length>0;
}

function renderMaker(){
  const m=document.getElementById('maker');
  m.innerHTML="";
  const cfg=document.createElement('div');
  cfg.className="card";
  cfg.innerHTML=`<h3>전역 설정</h3>
  <div>제목: ${data.config.title}</div>
  <div>시작 노드: ${data.config.startNode}</div>`;
  m.appendChild(cfg);

  Object.entries(data.scenes).forEach(([id,sc])=>{
    const c=document.createElement('div');
    c.className="card";
    c.innerHTML=`<h3>Scene: ${id}</h3><div>${sc.text}</div>`;
    m.appendChild(c);
  });
}

document.getElementById('playBtn').onclick=()=>{
  initPlayer();
  document.getElementById('maker').classList.add('hidden');
  document.getElementById('player').classList.remove('hidden');
};

document.getElementById('backMaker').onclick=()=>{
  document.getElementById('player').classList.add('hidden');
  document.getElementById('maker').classList.remove('hidden');
};

function initPlayer(){
  state.stats={};
  state.items=[];
  data.config.stats.forEach(s=>state.stats[s.key]=s.initial);
  go(data.config.startNode);
}

function go(id){
  const p=document.getElementById('player');
  p.innerHTML="";
  const sc=data.scenes[id];

  const hud=document.createElement('div');
  hud.className="hud";
  Object.entries(state.stats).forEach(([k,v])=>{
    const sp=document.createElement('span');
    sp.textContent=`${k}: ${v}`;
    hud.appendChild(sp);
  });
  p.appendChild(hud);

  const txt=document.createElement('div');
  txt.className="card";
  txt.textContent=sc.text;
  p.appendChild(txt);

  (sc.autoEvents||[]).forEach(a=>{
    if(state.stats[a.statKey]<a.threshold){
      alert(a.message);
      go(a.next);
      return;
    }
  });

  sc.options.forEach(op=>{
    const b=document.createElement('button');
    b.className="option-btn";
    b.textContent=op.text;
    if(op.requireItem && !state.items.includes(op.requireItem)){
      b.classList.add('disabled');
      b.title="아이템 필요";
    }
    b.onclick=()=>{
      if(op.effects){
        Object.entries(op.effects).forEach(([k,v])=>state.stats[k]+=v);
      }
      if(op.getItem){
        op.getItem.split(',').forEach(i=>state.items.push(i.trim()));
      }
      if(op.consumeItem){
        op.consumeItem.split(',').forEach(i=>{
          const idx=state.items.indexOf(i.trim());
          if(idx>-1) state.items.splice(idx,1);
        });
      }
      if(op.results){
        let r=Math.random()*100, acc=0;
        for(const res of op.results){
          acc+=res.chance;
          if(r<=acc){
            if(res.message) alert(res.message);
            if(res.effects){
              Object.entries(res.effects).forEach(([k,v])=>state.stats[k]+=v);
            }
            if(res.getItem){
              res.getItem.split(',').forEach(i=>state.items.push(i.trim()));
            }
            go(res.next);
            return;
          }
        }
      }
      if(op.isReset){ initPlayer(); return; }
      if(op.next) go(op.next);
    };
    p.appendChild(b);
  });
}
</script>
</body>
</html>
