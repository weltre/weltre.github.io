<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><title>Player v6.2.5</title><link rel="stylesheet" href="common.css"></head>
<body>
    <div id="load-screen" class="container" style="justify-content:center;align-items:center;">
        <h1 style="color:var(--point)">🎮 ENGINE v6.2.5</h1>
        <input type="file" id="loader" accept=".json">
    </div>
    <div id="game-ui" class="container" style="display:none">
        <div id="status-bar"></div><div id="inventory-bar"></div>
        <div id="scene-scroll"><div id="scene-text"></div></div>
        <div id="options-box"></div>
    </div>
    <div id="msg-box"><div id="msg-content" style="margin-bottom:20px;text-align:left;"></div><button class="btn btn-blue" style="width:100%" onclick="closeMsg()">확인</button></div>
<script>
    let sc, state = { stats: {}, inv: new Set(), clicks: {}, next: null };
    document.getElementById('loader').onchange = e => {
        const r = new FileReader();
        r.onload = ev => {
            sc = JSON.parse(ev.target.result);
            if(sc.config.themeColor) document.documentElement.style.setProperty('--point', sc.config.themeColor);
            if(sc.config.subColor) document.documentElement.style.setProperty('--sub', sc.config.subColor);
            document.getElementById('load-screen').style.display = 'none';
            document.getElementById('game-ui').style.display = 'flex';
            init();
        }; r.readAsText(e.target.files[0]);
    };
    function init() {
        state.inv = new Set(); state.clicks = {};
        sc.config.stats.forEach(s => state.stats[s.key] = Number(s.initial));
        render(sc.config.startNode);
    }
    function updateUI() {
        document.getElementById('status-bar').innerHTML = sc.config.stats.map(s => `<span>${s.label}: ${state.stats[s.key]}</span>`).join(' | ');
        document.getElementById('inventory-bar').innerText = "🎒 소지품: " + (state.inv.size ? Array.from(state.inv).join(', ') : "없음");
    }
    function applyData(obj) {
        if(!obj) return;
        if(obj.effects) Object.keys(obj.effects).forEach(k => state.stats[k] = (state.stats[k]||0) + Number(obj.effects[k]));
        if(obj.getItem) obj.getItem.split(',').forEach(v => v.trim() && state.inv.add(v.trim()));
        if(obj.removeItem) obj.removeItem.split(',').forEach(v => v.trim() && state.inv.delete(v.trim()));
    }
    function render(id) {
        const n = sc.scenes[id]; if(!n) return;
        if(n.autoEvents) {
            for(let e of n.autoEvents) {
                if((state.stats[e.statKey]||0) < (e.threshold||0)) { showMsg(e.message, e.next||id); return; }
            }
        }
        updateUI();
        document.getElementById('scene-text').innerText = n.text;
        const box = document.getElementById('options-box'); box.innerHTML = '';
        n.options.forEach((o, i) => {
            const btn = document.createElement('button'); btn.className = 'game-btn'; btn.innerText = o.text;
            let ok = true, miss = [];
            if(o.requireItem) o.requireItem.split(',').forEach(v => { if(v.trim() && !state.inv.has(v.trim())) { ok = false; miss.push(v.trim()); }});
            if(!ok) { btn.disabled = true; btn.innerText += ` (필요: ${miss.join(',')})`; }
            btn.onclick = () => {
                if(o.isReset) return init();
                applyData(o);
                if(o.results?.length > 0) {
                    let roll = Math.random()*100, acc = 0, res = o.results[o.results.length-1];
                    for(let r of o.results) { acc += r.chance; if(roll <= acc) { res = r; break; } }
                    applyData(res); showMsg(res.message, res.next || o.next || id);
                } else { render(o.next || id); }
            };
            box.appendChild(btn);
        });
    }
    function showMsg(t, n) { document.getElementById('msg-content').innerText = t; document.getElementById('msg-box').style.display = 'block'; state.next = n; }
    function closeMsg() { document.getElementById('msg-box').style.display = 'none'; render(state.next); }
</script></body></html>
