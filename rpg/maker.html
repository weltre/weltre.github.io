<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Ultimate Maker v5.3</title>
    <link rel="stylesheet" href="common.css">
    <style>
        body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #1a1d23; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        main { display: flex; flex: 1; overflow: hidden; }
        #sidebar { width: 280px; border-right: 1px solid #333; overflow-y: auto; background: #15181c; }
        #editor { flex: 1; padding: 25px; overflow-y: auto; background: #0f1115; }
        .node-card { padding: 12px 20px; border-bottom: 1px solid #222; cursor: pointer; color: #888; font-size: 0.9em; }
        .node-card.active { border-left: 4px solid var(--point); background: #1e2227; color: white; }
        .opt-edit-card { background: #1a1d23; padding: 15px; border-radius: 10px; margin-top: 15px; border: 1px solid #444; border-top: 3px solid var(--point); }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 8px; }
        label { font-size: 0.75em; color: var(--point); display: block; margin-top: 8px; font-weight: bold; }
        .section-title { border-bottom: 1px solid #333; padding-bottom: 5px; margin-top: 30px; font-size: 1em; color: var(--text); display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <header>
        <strong>🛠️ MAKER v5.3 (DUAL COLOR)</strong>
        <div>
            <button class="btn btn-blue" onclick="exportJSON()">💾 JSON 저장</button>
            <button class="btn btn-orange" onclick="document.getElementById('f-in').click()">📂 불러오기</button>
            <input type="file" id="f-in" style="display:none" onchange="importJSON(event)">
        </div>
    </header>
    <main>
        <div id="sidebar">
            <div style="padding:15px;"><button class="btn btn-blue" style="width:100%" onclick="addNode()">+ 새 장면 추가</button></div>
            <div id="node-list"></div>
        </div>
        <div id="editor">
            <div id="config-panel" style="background:#1a1d23; padding:20px; border-radius:10px; border:1px solid var(--point); margin-bottom:20px;">
                <div class="section-title" style="margin-top:0;">⚙️ 전역 설정 (메인 & 서브 색상)</div>
                <div class="grid-3">
                    <div><label>제목</label><input type="text" id="cfg-title" oninput="scenario.config.title=this.value"></div>
                    <div><label>메인 색상</label><input type="color" id="cfg-color" oninput="updateColor('point', this.value)"></div>
                    <div><label>서브 색상</label><input type="color" id="cfg-sub" oninput="updateColor('sub', this.value)"></div>
                </div>
            </div>
            <div id="edit-form" style="display:none">
                <div class="section-title">🖼️ 장면 편집</div>
                <label>장면 ID</label><input type="text" id="ed-id" onblur="renameNode()">
                <label>지문</label><textarea id="ed-text" rows="3" oninput="updateNode()"></textarea>
                <div class="section-title">🔘 선택지 리스트 <button class="btn btn-blue" onclick="addOption()">+ 추가</button></div>
                <div id="opt-container"></div>
            </div>
        </div>
    </main>

<script>
    let scenario = { config: { title: "New Game", startNode: "start", themeColor: "#0097e6", subColor: "#e67e22", stats: [{key:"hp", label:"❤️ 체력", initial:10}] }, scenes: { "start": { text: "첫 장면.", options: [] } } };
    let activeId = "start";

    function updateColor(type, val) {
        if(type === 'point') scenario.config.themeColor = val;
        else scenario.config.subColor = val;
        document.documentElement.style.setProperty('--' + type, val);
    }

    function renderConfig() {
        document.getElementById('cfg-title').value = scenario.config.title;
        document.getElementById('cfg-color').value = scenario.config.themeColor;
        document.getElementById('cfg-sub').value = scenario.config.subColor || "#e67e22";
        updateColor('point', scenario.config.themeColor);
        updateColor('sub', scenario.config.subColor || "#e67e22");
    }

    function addNode() { const id = "node_" + Date.now(); scenario.scenes[id] = {text:"지문", options:[]}; renderSidebar(); loadNode(id); }
    function renderSidebar() {
        const list = document.getElementById('node-list'); list.innerHTML = '';
        Object.keys(scenario.scenes).forEach(id => {
            const d = document.createElement('div'); d.className = `node-card ${activeId === id ? 'active' : ''}`;
            d.innerText = id; d.onclick = () => loadNode(id); list.appendChild(d);
        });
    }
    function loadNode(id) {
        activeId = id; document.getElementById('edit-form').style.display = 'block';
        document.getElementById('ed-id').value = id; document.getElementById('ed-text').value = scenario.scenes[id].text;
        renderOptions(); renderSidebar();
    }
    function renderOptions() {
        const container = document.getElementById('opt-container'); container.innerHTML = '';
        scenario.scenes[activeId].options.forEach((opt, i) => {
            const d = document.createElement('div'); d.className = 'opt-edit-card';
            d.innerHTML = `<input type="text" value="${opt.text}" oninput="scenario.scenes['${activeId}'].options[${i}].text=this.value">
                           <div class="grid-3">
                               <input type="text" placeholder="이동ID" value="${opt.next}" oninput="scenario.scenes['${activeId}'].options[${i}].next=this.value">
                               <input type="number" placeholder="최대클릭" value="${opt.maxClicks||''}" oninput="scenario.scenes['${activeId}'].options[${i}].maxClicks=Number(this.value)">
                               <button class="btn btn-red" onclick="scenario.scenes['${activeId}'].options.splice(${i},1); renderOptions();">삭제</button>
                           </div>`;
            container.appendChild(d);
        });
    }
    function addOption() { scenario.scenes[activeId].options.push({text:"선택지", next:activeId}); renderOptions(); }
    function updateNode() { scenario.scenes[activeId].text = document.getElementById('ed-text').value; }
    function renameNode() { const n = document.getElementById('ed-id').value; if(n && n !== activeId) { scenario.scenes[n] = scenario.scenes[activeId]; delete scenario.scenes[activeId]; activeId = n; renderSidebar(); } }
    function exportJSON() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(scenario, null, 2)], {type:"application/json"})); a.download="scenario_v5_3.json"; a.click(); }
    function importJSON(e) { const reader = new FileReader(); reader.onload = (ev) => { scenario = JSON.parse(ev.target.result); renderConfig(); renderSidebar(); loadNode(Object.keys(scenario.scenes)[0]); }; reader.readAsText(e.target.files[0]); }
    renderConfig(); renderSidebar();
</script>
</body>
</html>
