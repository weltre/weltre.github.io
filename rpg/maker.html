<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Story Engine v7</title>

<style>
:root {
  --bg:#0f1115; --card:#1a1d23; --text:#e0e0e0;
  --point:#00d2ff; --sub:#ff4757; --border:#333;
}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--text);
  font-family:system-ui, sans-serif;
}
button,input,textarea,select {
  background:#000; color:#fff; border:1px solid var(--border);
  border-radius:6px; padding:8px;
}
button { cursor:pointer; font-weight:600; }
nav {
  display:flex; border-bottom:1px solid var(--border);
  background:#15181c;
}
.nav-btn {
  flex:1; padding:14px; background:none; border:none;
  color:#888;
}
.nav-btn.active {
  color:var(--point); border-bottom:3px solid var(--point);
}
.container { max-width:1100px; margin:auto; height:100vh; display:flex; flex-direction:column; }
.view { flex:1; display:none; padding:16px; overflow:hidden; }
.card {
  background:var(--card); border:1px solid var(--border);
  border-radius:10px; padding:12px; margin-top:10px;
}
.list { display:flex; flex-direction:column; gap:8px; }
.game-btn {
  width:100%; padding:14px; text-align:left;
  border-left:4px solid var(--point);
}
.game-btn:disabled { opacity:.35; cursor:not-allowed; }
#scene-scroll { flex:1; overflow-y:auto; }
#status { margin-bottom:8px; color:var(--point); font-weight:700; }
#inv { font-size:13px; color:var(--sub); margin-bottom:10px; }
.split { display:flex; height:100%; }
#nodes { width:260px; border-right:1px solid var(--border); padding:10px; overflow-y:auto; }
#editor { flex:1; padding:16px; overflow-y:auto; }
.small { font-size:12px; opacity:.8; }
.warn { color:#ff6b6b; font-size:12px; }
</style>
</head>

<body>
<div class="container">

<nav>
  <button class="nav-btn active" onclick="switchTab('play')">PLAY</button>
  <button class="nav-btn" onclick="switchTab('maker')">MAKER</button>
  <button class="nav-btn" onclick="downloadJSON()">💾 SAVE</button>
  <input type="file" id="loadFile" hidden onchange="loadJSON(event)">
  <button class="nav-btn" onclick="document.getElementById('loadFile').click()">📂 LOAD</button>
</nav>

<!-- PLAY -->
<div id="play" class="view" style="display:flex;flex-direction:column;">
  <div id="status"></div>
  <div id="inv"></div>
  <div id="scene-scroll">
    <pre id="scene-text"></pre>
  </div>
  <div id="options" class="list"></div>
</div>

<!-- MAKER -->
<div id="maker" class="view">
  <div class="split">

    <div id="nodes">
      <button onclick="addScene()">+ 장면 추가</button>
      <div id="nodeList" class="list"></div>
    </div>

    <div id="editor">
      <div class="card">
        <h3>GLOBAL CONFIG</h3>
        <input id="cfg-title" placeholder="게임 제목">
        <input id="cfg-start" placeholder="시작 Node ID">
        <label>Theme <input type="color" id="cfg-theme"></label>
        <div id="statList"></div>
        <button onclick="addStat()">+ 스탯</button>
      </div>

      <div id="sceneEditor"></div>
      <div id="validation" class="warn"></div>
    </div>

  </div>
</div>

</div>

<script>
/* =====================
   DATA MODEL
===================== */

let scenario = {
  config:{
    title:"예제 게임",
    themeColor:"#00d2ff",
    startNode:"start",
    stats:[{key:"hp",label:"체력",initial:100}]
  },
  scenes:{
    start:{
      text:"시작 장면입니다.",
      options:[]
    }
  }
};

let runtime = {};
let currentNode = null;

/* =====================
   UTIL
===================== */

const $ = id => document.getElementById(id);

function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* =====================
   TABS
===================== */

function switchTab(tab){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  document.querySelectorAll('.view').forEach(v=>v.style.display='none');
  $(tab).style.display='flex';
  if(tab==='play') startGame();
  if(tab==='maker') renderMaker();
}

/* =====================
   PLAYER
===================== */

function startGame(){
  runtime = {
    stats:{},
    inv:new Set(),
    clicks:{}
  };
  scenario.config.stats.forEach(s=>runtime.stats[s.key]=s.initial);
  applyTheme();
  goNode(scenario.config.startNode);
}

function goNode(id){
  const node = scenario.scenes[id];
  if(!node) return;
  currentNode = id;

  if(node.autoEvents){
    for(const e of node.autoEvents){
      if((runtime.stats[e.statKey]||0) < e.threshold){
        alert(e.message);
        goNode(e.next);
        return;
      }
    }
  }

  $('scene-text').textContent = node.text;
  $('status').textContent =
    scenario.config.stats.map(s=>`${s.label}: ${runtime.stats[s.key]}`).join(" | ");
  $('inv').textContent =
    "🎒 " + (runtime.inv.size? [...runtime.inv].join(", "):"소지품 없음");

  const box = $('options');
  box.innerHTML="";

  (node.options||[]).forEach((o,i)=>{
    const key = id+"_"+i;
    if(o.maxClicks && (runtime.clicks[key]||0)>=o.maxClicks) return;

    const btn = document.createElement('button');
    btn.className="game-btn";
    btn.textContent=o.text;

    if(o.requireItem){
      const miss = o.requireItem.split(',').map(v=>v.trim()).filter(v=>!runtime.inv.has(v));
      if(miss.length){
        btn.disabled=true;
        btn.title="필요: "+miss.join(",");
      }
    }

    btn.onclick=()=>{
      runtime.clicks[key]=(runtime.clicks[key]||0)+1;
      if(o.isReset){ startGame(); return; }

      applyEffects(o);

      if(o.results?.length){
        let roll=Math.random()*100,acc=0,res=o.results.at(-1);
        for(const r of o.results){
          acc+=r.chance;
          if(roll<=acc){ res=r; break; }
        }
        if(res.message) alert(res.message);
        applyEffects(res);
        goNode(res.next||id);
      }else{
        goNode(o.next||id);
      }
    };
    box.appendChild(btn);
  });
}

function applyEffects(o){
  if(o.effects) for(const k in o.effects)
    runtime.stats[k]=(runtime.stats[k]||0)+Number(o.effects[k]);
  if(o.getItem) o.getItem.split(',').forEach(v=>runtime.inv.add(v.trim()));
  if(o.removeItem) o.removeItem.split(',').forEach(v=>runtime.inv.delete(v.trim()));
}

/* =====================
   MAKER
===================== */

function renderMaker(){
  applyTheme();
  $('cfg-title').value=scenario.config.title;
  $('cfg-start').value=scenario.config.startNode;
  $('cfg-theme').value=scenario.config.themeColor;

  $('cfg-title').oninput=e=>scenario.config.title=e.target.value;
  $('cfg-start').oninput=e=>scenario.config.startNode=e.target.value;
  $('cfg-theme').oninput=e=>{
    scenario.config.themeColor=e.target.value;
    applyTheme();
  };

  renderStats();
  renderNodeList();
}

function renderStats(){
  const box=$('statList'); box.innerHTML="";
  scenario.config.stats.forEach((s,i)=>{
    const d=document.createElement('div');
    d.innerHTML=`
      <input value="${s.label}" placeholder="label"
        oninput="scenario.config.stats[${i}].label=this.value">
      <input value="${s.key}" placeholder="key"
        oninput="scenario.config.stats[${i}].key=this.value">
      <input type="number" value="${s.initial}"
        oninput="scenario.config.stats[${i}].initial=Number(this.value)">
    `;
    box.appendChild(d);
  });
}

function renderNodeList(){
  const box=$('nodeList'); box.innerHTML="";
  Object.keys(scenario.scenes).forEach(id=>{
    const b=document.createElement('button');
    b.textContent=id;
    b.onclick=()=>editScene(id);
    box.appendChild(b);
  });
}

function editScene(id){
  const n=scenario.scenes[id];
  const ed=$('sceneEditor');
  ed.innerHTML=`
    <div class="card">
      <input value="${id}" onchange="renameScene('${id}',this.value)">
      <textarea oninput="scenario.scenes['${id}'].text=this.value">${n.text}</textarea>
      <div id="optBox"></div>
      <button onclick="addOption('${id}')">+ 선택지</button>
    </div>`;
  renderOptions(id);
}

function renderOptions(id){
  const box=$('optBox'); box.innerHTML="";
  scenario.scenes[id].options.forEach((o,i)=>{
    const d=document.createElement('div');
    d.className="card";
    d.innerHTML=`
      <input value="${o.text||''}"
        oninput="scenario.scenes['${id}'].options[${i}].text=this.value">
      <input placeholder="next" value="${o.next||''}"
        oninput="scenario.scenes['${id}'].options[${i}].next=this.value">
      <textarea placeholder="effects JSON"
        oninput="scenario.scenes['${id}'].options[${i}].effects=JSON.parse(this.value)">
${JSON.stringify(o.effects||{},null,2)}</textarea>
    `;
    box.appendChild(d);
  });
}

function addScene(){
  const id="node_"+Date.now();
  scenario.scenes[id]={text:"",options:[]};
  renderNodeList(); editScene(id);
}

function addOption(id){
  scenario.scenes[id].options.push({text:"선택지",next:id});
  renderOptions(id);
}

function renameScene(oldId,newId){
  if(!newId||scenario.scenes[newId]) return;
  scenario.scenes[newId]=scenario.scenes[oldId];
  delete scenario.scenes[oldId];
  Object.values(scenario.scenes).forEach(s=>{
    s.options?.forEach(o=>{
      if(o.next===oldId) o.next=newId;
      o.results?.forEach(r=>{ if(r.next===oldId) r.next=newId; });
    });
    s.autoEvents?.forEach(a=>{ if(a.next===oldId) a.next=newId; });
  });
  renderNodeList(); editScene(newId);
}

/* =====================
   IO / THEME
===================== */

function applyTheme(){
  document.documentElement.style.setProperty('--point',scenario.config.themeColor);
}

function downloadJSON(){
  validate();
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(scenario,null,2)]));
  a.download="scenario.json";
  a.click();
}

function loadJSON(e){
  const r=new FileReader();
  r.onload=ev=>{
    scenario=JSON.parse(ev.target.result);
    renderMaker();
  };
  r.readAsText(e.target.files[0]);
}

function validate(){
  let warn=[];
  if(!scenario.scenes[scenario.config.startNode])
    warn.push("startNode가 존재하지 않습니다.");
  $('validation').textContent=warn.join(" / ");
}
</script>
</body>
</html>
