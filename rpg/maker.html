<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>THE CLASSIC ENGINE v7.5</title>
    <style>
        :root { --bg: #0a0a0c; --text: #33ff33; --border: #33ff33; --dim: #004400; }
        body { background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; }
        
        /* Game Screen */
        #screen { flex: 1; border: 2px solid var(--border); padding: 20px; overflow-y: auto; display: flex; flex-direction: column; box-shadow: inset 0 0 20px var(--dim); }
        #status { border-bottom: 1px solid var(--dim); padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; font-weight: bold; }
        #text-area { flex: 1; font-size: 1.2rem; line-height: 1.6; margin-bottom: 20px; }
        #choices { display: grid; grid-template-columns: 1fr; gap: 10px; }
        
        /* Classic Buttons */
        .btn { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 12px; cursor: pointer; text-align: left; font-size: 1rem; }
        .btn:hover { background: var(--text); color: var(--bg); }
        .btn:disabled { color: var(--dim); border-color: var(--dim); cursor: not-allowed; }

        /* Tools */
        #tools { margin-top: 20px; display: flex; gap: 10px; opacity: 0.5; }
        #tools:hover { opacity: 1; }
        textarea { background: #000; color: #33ff33; border: 1px solid var(--dim); width: 100%; height: 100px; margin-top: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="status">
    <div id="stats-display"></div>
    <div id="inv-display"></div>
</div>

<div id="screen">
    <div id="text-area"></div>
    <div id="choices"></div>
</div>

<div id="tools">
    <button onclick="saveData()">[SAVE DATA]</button>
    <button onclick="document.getElementById('file-input').click()">[LOAD DATA]</button>
    <input type="file" id="file-input" class="hidden" onchange="loadData(event)">
    <button onclick="toggleEditor()">[TOGGLE EDITOR]</button>
</div>

<div id="editor" class="hidden">
    <h3>DATA EDITOR (JSON)</h3>
    <textarea id="json-input"></textarea>
    <button onclick="applyJson()">APPLY CHANGES</button>
</div>

<script>
    // 1. 초기 데이터 (작가님이 원하신 모든 기능 포함)
    let gameData = {
        config: { start: "start", stats: { oxygen: 100, sanity: 50 } },
        scenes: {
            "start": {
                text: "심해 4,000m. 거대한 철문 앞에 섰습니다. \n수압이 외벽을 긁는 소리가 들립니다.",
                options: [
                    { text: "철문을 강제로 연다", next: "hallway", effects: { oxygen: -10 } },
                    { text: "산소 장치를 점검한다 (최대 2회)", next: "start", maxClicks: 2, effects: { oxygen: 5 } }
                ]
            },
            "hallway": {
                text: "좁은 복도입니다. 바닥에 '카드키'가 떨어져 있습니다.",
                options: [
                    { text: "카드키를 줍는다", next: "hallway", getItem: "카드키" },
                    { text: "잠긴 보안실로 향한다", next: "security", requireItem: "카드키" }
                ],
                autoEvents: [
                    { stat: "oxygen", val: 1, next: "game_over", msg: "산소가 고갈되었습니다..." }
                ]
            },
            "security": {
                text: "보안실에 진입했습니다. 당신은 살아남았습니다!",
                options: [{ text: "다시 시작", reset: true }]
            },
            "game_over": {
                text: "차갑고 어두운 물이 폐로 들어옵니다...",
                options: [{ text: "재시작", reset: true }]
            }
        }
    };

    let state = { stats: {}, inv: new Set(), clicks: {} };

    // 2. 게임 로직 (군더더기 없이 핵심만)
    function init() {
        state.stats = { ...gameData.config.stats };
        state.inv = new Set();
        state.clicks = {};
        render("start");
    }

    function render(id) {
        const scene = gameData.scenes[id];
        if (!scene) return;

        // Auto Event Check
        if (scene.autoEvents) {
            for (let e of scene.autoEvents) {
                if (state.stats[e.stat] < e.val) {
                    alert(e.msg);
                    render(e.next);
                    return;
                }
            }
        }

        // Stats Display
        document.getElementById('stats-display').innerText = Object.entries(state.stats).map(([k, v]) => `${k.toUpperCase()}:${v}`).join(' ');
        document.getElementById('inv-display').innerText = "INV: " + (state.inv.size ? [...state.inv].join(',') : "EMPTY");
        
        // Text
        document.getElementById('text-area').innerText = scene.text;

        // Choices
        const choiceArea = document.getElementById('choices');
        choiceArea.innerHTML = "";
        (scene.options || []).forEach((o, i) => {
            const key = `${id}_${i}`;
            if (o.maxClicks && (state.clicks[key] || 0) >= o.maxClicks) return;

            const btn = document.createElement('button');
            btn.className = "btn";
            
            let canDo = true;
            if (o.requireItem && !state.inv.has(o.requireItem)) canDo = false;

            btn.innerText = `> ${o.text}${o.maxClicks ? ` (${state.clicks[key]||0}/${o.maxClicks})` : ""}`;
            if (!canDo) btn.innerText += ` [필요: ${o.requireItem}]`;
            btn.disabled = !canDo;

            btn.onclick = () => {
                state.clicks[key] = (state.clicks[key] || 0) + 1;
                if (o.reset) return init();
                if (o.effects) Object.entries(o.effects).forEach(([k, v]) => state.stats[k] += v);
                if (o.getItem) state.inv.add(o.getItem);
                render(o.next || id);
            };
            choiceArea.appendChild(btn);
        });
        
        document.getElementById('json-input').value = JSON.stringify(gameData, null, 2);
    }

    // 3. 유틸리티 (저장/로드)
    function toggleEditor() { document.getElementById('editor').classList.toggle('hidden'); }
    function applyJson() { try { gameData = JSON.parse(document.getElementById('json-input').value); init(); } catch(e) { alert("JSON 오류!"); } }
    function saveData() {
        const blob = new Blob([JSON.stringify(gameData, null, 2)], {type: "application/json"});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "game_data.json"; a.click();
    }
    function loadData(e) {
        const reader = new FileReader();
        reader.onload = ev => { gameData = JSON.parse(ev.target.result); init(); };
        reader.readAsText(e.target.files[0]);
    }

    init();
</script>
</body>
</html>
