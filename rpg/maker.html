<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><title>Maker v6.2.0</title><link rel="stylesheet" href="common.css"></head>
<body style="display:flex; flex-direction:column; height:100vh;">
    <div style="background:#1a1d23; padding:15px; display:flex; justify-content:space-between; border-bottom:1px solid #333;">
        <strong style="color:var(--point)">ENGINE MAKER v6.2.0</strong>
        <div><button class="btn btn-blue" onclick="save()">💾 저장</button><input type="file" id="f-in" style="display:none" onchange="load(event)"><button class="btn btn-blue" style="margin-left:5px;" onclick="document.getElementById('f-in').click()">📂 로드</button></div>
    </div>
    <div style="display:flex; flex:1; overflow:hidden;">
        <div id="side" style="width:250px; border-right:1px solid #333; overflow-y:auto; background:#15181c;">
            <div style="padding:15px;"><button class="btn btn-blue" style="width:100%" onclick="addNode()">+ 장면 추가</button></div>
            <div id="node-list"></div>
        </div>
        <div id="edit" style="flex:1; padding:25px; overflow-y:auto;">
            <div class="opt-edit-card" style="margin-top:0;">
                <label>시나리오 설정</label>
                <input type="text" id="cfg-title" placeholder="게임 제목" oninput="sc.config.title=this.value">
                <button class="btn btn-blue" style="width:100%; margin-top:10px;" onclick="addStat()">+ 스탯 추가</button>
                <div id="stat-list"></div>
            </div>
            <div id="node-editor" style="display:none">
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin:15px 0;">
                    <input type="text" id="ed-id" onblur="rename()">
                    <button class="btn btn-blue" onclick="addOpt()">+ 선택지 추가</button>
                </div>
                <textarea id="ed-text" rows="5" oninput="sc.scenes[cur].text=this.value"></textarea>
                <div id="opt-list"></div>
            </div>
        </div>
    </div>
<script>
    let sc = { config: { title: "New Game", startNode: "start", stats: [{key:"hp", label:"HP", initial:10}] }, scenes: { "start": { text: "시작", options: [] } } };
    let cur = "start";
    function addStat() { sc.config.stats.push({key:"s"+Date.now(), label:"새 스탯", initial:0}); stats(); }
    function stats() {
        const l = document.getElementById('stat-list'); l.innerHTML = '';
        sc.config.stats.forEach((s, i) => {
            const d = document.createElement('div'); d.style.display="flex"; d.style.gap="5px";
            d.innerHTML = `<input type="text" value="${s.label}" oninput="sc.config.stats[${i}].label=this.value">
                           <input type="text" value="${s.key}" onblur="sc.config.stats[${i}].key=this.value">
                           <button class="btn btn-red" onclick="sc.config.stats.splice(${i},1); stats();">X</button>`;
            l.appendChild(d);
        });
    }
    function addNode() { const id = "n"+Date.now(); sc.scenes[id] = {text:"내용", options:[]}; list(); loadNode(id); }
    function list() {
        const l = document.getElementById('node-list'); l.innerHTML = '';
        Object.keys(sc.scenes).forEach(id => {
            const d = document.createElement('div'); d.innerText = id; d.className = "game-btn";
            d.style.padding = "10px"; d.style.margin = "5px 15px"; d.style.fontSize="0.8em";
            d.style.borderColor = cur === id ? "var(--point)" : "#333";
            d.onclick = () => loadNode(id); l.appendChild(d);
        });
    }
    function loadNode(id) { cur = id; document.getElementById('node-editor').style.display = 'block'; document.getElementById('ed-id').value = id; document.getElementById('ed-text').value = sc.scenes[id].text; list(); opts(); }
    function addOpt() { sc.scenes[cur].options.push({text:"선택지", next:cur}); opts(); }
    function opts() {
        const l = document.getElementById('opt-list'); l.innerHTML = '';
        sc.scenes[cur].options.forEach((o, i) => {
            const d = document.createElement('div'); d.className = 'opt-edit-card';
            d.innerHTML = `<input type="text" value="${o.text}" oninput="sc.scenes['${cur}'].options[${i}].text=this.value">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px;">
                    <input type="text" placeholder="다음장면" value="${o.next||''}" oninput="sc.scenes['${cur}'].options[${i}].next=this.value">
                    <input type="text" placeholder="필요아이템" value="${o.requireItem||''}" oninput="sc.scenes['${cur}'].options[${i}].requireItem=this.value">
                </div>
                <button class="btn btn-blue" style="width:100%; margin-top:5px;" onclick="addRes(${i})">+ 확률 결과 추가</button>
                <div id="res-${i}"></div>
                <button class="btn btn-red" style="width:100%; margin-top:5px;" onclick="sc.scenes['${cur}'].options.splice(${i},1); opts();">삭제</button>`;
            l.appendChild(d);
            o.results?.forEach((r, ri) => {
                const rd = document.createElement('div'); rd.style.border="1px dashed #555"; rd.style.padding="10px"; rd.style.marginTop="5px";
                rd.innerHTML = `<div style="display:flex; gap:5px;"><input type="number" value="${r.chance}" oninput="sc.scenes['${cur}'].options[${i}].results[${ri}].chance=Number(this.value)">
                                <input type="text" placeholder="이동ID" value="${r.next||''}" oninput="sc.scenes['${cur}'].options[${i}].results[${ri}].next=this.value"></div>
                                <textarea oninput="sc.scenes['${cur}'].options[${i}].results[${ri}].message=this.value">${r.message}</textarea>`;
                d.querySelector(`#res-${i}`).appendChild(rd);
            });
        });
    }
    function addRes(i) { if(!sc.scenes[cur].options[i].results) sc.scenes[cur].options[i].results = [];
        sc.scenes[cur].options[i].results.push({chance:50, message:"결과 메시지", next:""}); opts(); }
    function rename() { const n = document.getElementById('ed-id').value; if(n!==cur){ sc.scenes[n]=sc.scenes[cur]; delete sc.scenes[cur]; cur=n; list(); } }
    function save() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(sc, null, 2)])); a.download="game.json"; a.click(); }
    function load(e) { const r = new FileReader(); r.onload = ev => { sc = JSON.parse(ev.target.result); stats(); list(); loadNode(Object.keys(sc.scenes)[0]); }; r.readAsText(e.target.files[0]); }
    stats(); list(); loadNode("start");
</script></body></html>
