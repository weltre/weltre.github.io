<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><title>Maker v6.2.5</title><link rel="stylesheet" href="common.css"></head>
<body style="display:flex; flex-direction:column; height:100vh;">
    <div style="background:#1a1d23; padding:15px; display:flex; justify-content:space-between; border-bottom:1px solid #333;">
        <strong style="color:var(--point)">ENGINE MAKER v6.2.5</strong>
        <div>
            <button class="btn btn-orange" onclick="document.getElementById('f-in').click()">📂 로드</button>
            <button class="btn btn-blue" onclick="save()">💾 저장</button>
            <input type="file" id="f-in" style="display:none" onchange="load(event)">
        </div>
    </div>
    <div style="display:flex; flex:1; overflow:hidden;">
        <div id="side" style="width:280px; border-right:1px solid #333; overflow-y:auto; background:#15181c;">
            <div style="padding:15px;"><button class="btn btn-blue" style="width:100%" onclick="addNode()">+ 장면 추가</button></div>
            <div id="node-list"></div>
        </div>
        <div id="edit" style="flex:1; padding:25px; overflow-y:auto;">
            <div class="opt-edit-card" style="margin-top:0;">
                <label style="color:var(--point); font-weight:bold;">시나리오 설정</label>
                <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;">
                    <input type="text" id="cfg-title" placeholder="게임 제목">
                    <div style="display:flex;align-items:center;gap:5px;"><label>메인</label><input type="color" id="cfg-main"></div>
                    <div style="display:flex;align-items:center;gap:5px;"><label>서브</label><input type="color" id="cfg-sub"></div>
                </div>
                <button class="btn btn-blue" style="width:100%; margin-top:10px;" onclick="addStat()">+ 스탯 추가</button>
                <div id="stat-list"></div>
            </div>
            <div id="node-editor" style="display:none">
                <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; margin:15px 0;">
                    <input type="text" id="ed-id" onblur="rename()">
                    <button class="btn btn-orange" onclick="addAuto()">+ 자동이벤트</button>
                    <button class="btn btn-blue" onclick="addOpt()">+ 선택지 추가</button>
                </div>
                <textarea id="ed-text" rows="5" placeholder="장면 텍스트"></textarea>
                <div id="auto-list"></div><div id="opt-list"></div>
            </div>
        </div>
    </div>
<script>
    let sc = { config: { title: "", themeColor: "#00d2ff", subColor: "#ff9f43", stats: [] }, scenes: { "start": { text: "시작", options: [] } } };
    let cur = "start";

    // 데이터 싱크 함수
    function sync() {
        sc.config.title = document.getElementById('cfg-title').value;
        sc.config.themeColor = document.getElementById('cfg-main').value;
        sc.config.subColor = document.getElementById('cfg-sub').value;
        if(cur && sc.scenes[cur]) sc.scenes[cur].text = document.getElementById('ed-text').value;
    }

    function load(e) {
        const r = new FileReader();
        r.onload = ev => {
            sc = JSON.parse(ev.target.result);
            document.getElementById('cfg-title').value = sc.config.title || "";
            document.getElementById('cfg-main').value = sc.config.themeColor || "#00d2ff";
            document.getElementById('cfg-sub').value = sc.config.subColor || "#ff9f43";
            stats(); list(); loadNode(sc.config.startNode || Object.keys(sc.scenes)[0]);
        }; r.readAsText(e.target.files[0]);
    }

    function stats() {
        const l = document.getElementById('stat-list'); l.innerHTML = '';
        sc.config.stats.forEach((s, i) => {
            const d = document.createElement('div'); d.style.display="flex"; d.style.gap="5px"; d.style.marginTop="5px";
            d.innerHTML = `<input type="text" value="${s.label}" placeholder="표기명" oninput="sc.config.stats[${i}].label=this.value">
                           <input type="text" value="${s.key}" placeholder="키(영문)" onblur="sc.config.stats[${i}].key=this.value">
                           <input type="number" value="${s.initial}" oninput="sc.config.stats[${i}].initial=Number(this.value)">
                           <button class="btn btn-red" onclick="sc.config.stats.splice(${i},1); stats();">X</button>`;
            l.appendChild(d);
        });
    }

    function loadNode(id) {
        sync(); cur = id;
        document.getElementById('node-editor').style.display = 'block';
        document.getElementById('ed-id').value = id;
        document.getElementById('ed-text').value = sc.scenes[id].text || "";
        list(); opts(); autos();
    }

    function opts() {
        const l = document.getElementById('opt-list'); l.innerHTML = '';
        sc.scenes[cur].options.forEach((o, i) => {
            const d = document.createElement('div'); d.className = 'opt-edit-card';
            d.innerHTML = `<input type="text" value="${o.text||''}" placeholder="선택지 내용" oninput="sc.scenes['${cur}'].options[${i}].text=this.value">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-top:5px;">
                    <input type="text" placeholder="다음장면" value="${o.next||''}" oninput="sc.scenes['${cur}'].options[${i}].next=this.value">
                    <input type="text" placeholder="필요 아이템" value="${o.requireItem||''}" oninput="sc.scenes['${cur}'].options[${i}].requireItem=this.value">
                    <input type="text" placeholder="획득 아이템" value="${o.getItem||''}" oninput="sc.scenes['${cur}'].options[${i}].getItem=this.value">
                    <input type="text" placeholder="소모 아이템" value="${o.removeItem||''}" oninput="sc.scenes['${cur}'].options[${i}].removeItem=this.value">
                </div>
                <button class="btn btn-orange" style="width:100%; margin-top:8px;" onclick="addRes(${i})">+ 확률 결과 추가</button>
                <div id="res-${i}"></div>
                <button class="btn btn-red" style="width:100%; margin-top:10px;" onclick="sc.scenes['${cur}'].options.splice(${i},1); opts();">선택지 삭제</button>`;
            l.appendChild(d);
            o.results?.forEach((r, ri) => {
                const rd = document.createElement('div'); rd.className = "res-edit-card";
                rd.innerHTML = `<div style="display:flex;gap:5px;"><input type="number" value="${r.chance}" style="width:60px;" oninput="sc.scenes['${cur}'].options[${i}].results[${ri}].chance=Number(this.value)">% 
                                <input type="text" placeholder="이동ID" value="${r.next||''}" oninput="sc.scenes['${cur}'].options[${i}].results[${ri}].next=this.value">
                                <input type="text" placeholder="획득템" value="${r.getItem||''}" oninput="sc.scenes['${cur}'].options[${i}].results[${ri}].getItem=this.value"></div>
                                <textarea oninput="sc.scenes['${cur}'].options[${i}].results[${ri}].message=this.value" placeholder="결과 메시지">${r.message||''}</textarea>
                                <button class="btn btn-red" style="width:100%;padding:2px;" onclick="sc.scenes['${cur}'].options[${i}].results.splice(${ri},1); opts();">결과 삭제</button>`;
                d.querySelector(`#res-${i}`).appendChild(rd);
            });
        });
    }

    function autos() {
        const l = document.getElementById('auto-list'); l.innerHTML = '';
        sc.scenes[cur].autoEvents?.forEach((e, i) => {
            const d = document.createElement('div'); d.className = "res-edit-card"; d.style.borderColor="var(--sub)";
            d.innerHTML = `<select onchange="sc.scenes['${cur}'].autoEvents[${i}].statKey=this.value">
                           ${sc.config.stats.map(s=>`<option value="${s.key}" ${s.key===e.statKey?'selected':''}>${s.label}</option>`).join('')}</select>
                           <input type="number" value="${e.threshold}" oninput="sc.scenes['${cur}'].autoEvents[${i}].threshold=Number(this.value)"> 미만 시
                           <input type="text" placeholder="이동ID" value="${e.next||''}" oninput="sc.scenes['${cur}'].autoEvents[${i}].next=this.value">
                           <textarea oninput="sc.scenes['${cur}'].autoEvents[${i}].message=this.value" placeholder="이벤트 메시지">${e.message||''}</textarea>
                           <button class="btn btn-red" style="width:100%" onclick="sc.scenes['${cur}'].autoEvents.splice(${i},1); autos();">자동이벤트 삭제</button>`;
            l.appendChild(d);
        });
    }

    function addStat() { sc.config.stats.push({key:"stat_"+Date.now(), label:"신규스탯", initial:0}); stats(); }
    function addNode() { const id = "node_"+Date.now(); sc.scenes[id] = {text:"", options:[]}; list(); loadNode(id); }
    function addOpt() { sc.scenes[cur].options.push({text:"선택지", next:cur, effects:{}}); opts(); }
    function addRes(i) { if(!sc.scenes[cur].options[i].results) sc.scenes[cur].options[i].results = []; 
        sc.scenes[cur].options[i].results.push({chance:50, message:"", next:"", getItem:""}); opts(); }
    function addAuto() { if(!sc.scenes[cur].autoEvents) sc.scenes[cur].autoEvents = [];
        sc.scenes[cur].autoEvents.push({statKey:sc.config.stats[0]?.key||"", threshold:0, next:"", message:""}); autos(); }
    function list() {
        const l = document.getElementById('node-list'); l.innerHTML = '';
        Object.keys(sc.scenes).forEach(id => {
            const d = document.createElement('div'); d.innerText = id; d.className = "game-btn";
            d.style.padding = "10px"; d.style.margin = "5px 15px"; d.style.fontSize="0.8em";
            d.style.borderColor = cur === id ? "var(--point)" : "#333";
            d.onclick = () => loadNode(id); l.appendChild(d);
        });
    }
    function save() { sync(); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(sc, null, 2)])); a.download="scenario.json"; a.click(); }
    function rename() { const n = document.getElementById('ed-id').value; if(n&&n!==cur){ sc.scenes[n]=sc.scenes[cur]; delete sc.scenes[cur]; cur=n; list(); } }
    
    stats(); list(); loadNode("start");
</script></body></html>
