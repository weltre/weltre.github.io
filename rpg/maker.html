<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><title>Maker</title><link rel="stylesheet" href="common.css"></head>
<body>
    <div style="background:#1a1d23; padding:10px; display:flex; justify-content:space-between;">
        <strong>MAKER v6.1.8</strong>
        <button onclick="save()">💾 저장</button>
    </div>
    <div class="container" style="flex-direction:row; height:calc(100vh - 50px);">
        <div id="side" style="width:200px; border-right:1px solid #333; overflow-y:auto;">
            <button onclick="addNode()" style="width:100%">+ 장면 추가</button>
            <div id="node-list"></div>
        </div>
        <div id="edit" style="flex:1; padding:20px; overflow-y:auto;">
            <div id="node-editor" style="display:none">
                <input type="text" id="ed-id" onblur="rename()">
                <textarea id="ed-text" rows="5" oninput="upd()"></textarea>
                <button onclick="addOpt()">+ 선택지 추가</button>
                <div id="opt-list"></div>
            </div>
        </div>
    </div>
<script>
    let sc = { config: { startNode: "start", stats: [{key:"hp", label:"HP", initial:10}] }, scenes: { "start": { text: "시작", options: [] } } };
    let cur = "start";
    function addNode() { const id = "n"+Date.now(); sc.scenes[id] = {text:"내용", options:[]}; list(); load(id); }
    function list() {
        const l = document.getElementById('node-list'); l.innerHTML = '';
        Object.keys(sc.scenes).forEach(id => {
            const d = document.createElement('div'); d.innerText = id;
            d.style.padding = "5px"; d.style.cursor = "pointer";
            d.onclick = () => load(id); l.appendChild(d);
        });
    }
    function load(id) {
        cur = id; document.getElementById('node-editor').style.display = 'block';
        document.getElementById('ed-id').value = id;
        document.getElementById('ed-text').value = sc.scenes[id].text;
        opts();
    }
    function addOpt() { sc.scenes[cur].options.push({text:"선택지", next:cur}); opts(); }
    function opts() {
        const l = document.getElementById('opt-list'); l.innerHTML = '';
        sc.scenes[cur].options.forEach((o, i) => {
            const d = document.createElement('div'); d.className = 'opt-card';
            d.innerHTML = `
                <input type="text" value="${o.text}" oninput="sc.scenes['${cur}'].options[${i}].text=this.value">
                <input type="text" placeholder="다음 장면" value="${o.next||''}" oninput="sc.scenes['${cur}'].options[${i}].next=this.value">
                <button onclick="addRes(${i})">+ 확률결과</button>
                <div id="res-${i}"></div>
            `;
            l.appendChild(d);
            const rl = d.querySelector(`#res-${i}`);
            o.results?.forEach((r, ri) => {
                const rd = document.createElement('div'); rd.style.border="1px dashed #555";
                rd.innerHTML = `<input type="number" value="${r.chance}" oninput="sc.scenes['${cur}'].options[${i}].results[${ri}].chance=Number(this.value)">
                                <input type="text" value="${r.next||''}" oninput="sc.scenes['${cur}'].options[${i}].results[${ri}].next=this.value">
                                <textarea oninput="sc.scenes['${cur}'].options[${i}].results[${ri}].message=this.value">${r.message}</textarea>`;
                rl.appendChild(rd);
            });
        });
    }
    function addRes(i) { if(!sc.scenes[cur].options[i].results) sc.scenes[cur].options[i].results = [];
        sc.scenes[cur].options[i].results.push({chance:50, message:"결과", next:""}); opts(); }
    function upd() { sc.scenes[cur].text = document.getElementById('ed-text').value; }
    function rename() { const n = document.getElementById('ed-id').value; if(n!==cur){ sc.scenes[n]=sc.scenes[cur]; delete sc.scenes[cur]; cur=n; list(); } }
    function save() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(sc, null, 2)])); a.download="game.json"; a.click(); }
    list(); load("start");
</script></body></html>
