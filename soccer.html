<!DOCTYPE html><html><head><meta charset="UTF-8"><title>2인 축구</title>
<link rel="stylesheet" href="style.css"></head><body>
<div class="container">
    <div class="status-bar">
        <div id="p1-score" style="font-size:40px; color:#3498db; font-weight:bold;">0</div>
        <div id="res-msg" style="font-size:22px; font-weight:bold; color:var(--timer); min-width:200px;">매치 시작!</div>
        <div id="p2-score" style="font-size:40px; color:#e74c3c; font-weight:bold;">0</div>
    </div>
    <canvas id="soccerCanvas" width="760" height="460"></canvas>
    <div class="info-text">P1: WASD | P2: 방향키<br><button onclick="location.href='index.html'">목록으로</button></div>
</div>
<script>
    const cvs=document.getElementById("soccerCanvas"), ctx=cvs.getContext("2d");
    const p1s=document.getElementById("p1-score"), p2s=document.getElementById("p2-score"), msg=document.getElementById("res-msg");
    let keys={}, isOver=false, ball={x:380,y:230,vx:0,vy:0,r:12}, p1={x:150,y:230,score:0,r:25}, p2={x:610,y:230,score:0,r:25};
    window.onkeydown=e=>keys[e.key.toLowerCase()]=keys[e.key]=true; 
    window.onkeyup=e=>keys[e.key.toLowerCase()]=keys[e.key]=false;
    function loop() {
        if(!isOver) {
            if(keys['w']&&p1.y>25) p1.y-=5; if(keys['s']&&p1.y<435) p1.y+=5; if(keys['a']&&p1.x>25) p1.x-=5; if(keys['d']&&p1.x<735) p1.x+=5;
            if(keys['arrowup']&&p2.y>25) p2.y-=5; if(keys['arrowdown']&&p2.y<435) p2.y+=5; if(keys['arrowleft']&&p2.x>25) p2.x-=5; if(keys['arrowright']&&p2.x<735) p2.x+=5;
            ball.x+=ball.vx; ball.y+=ball.vy; ball.vx*=0.98; ball.vy*=0.98;
            if(ball.x<15||ball.x>745) ball.vx*=-1; if(ball.y<15||ball.y>445) ball.vy*=-1;
            [p1,p2].forEach(p=>{ let d=Math.hypot(ball.x-p.x,ball.y-p.y); if(d<ball.r+p.r){ let a=Math.atan2(ball.y-p.y,ball.x-p.x); ball.vx=Math.cos(a)*7; ball.vy=Math.sin(a)*7; } });
            if(ball.y>150&&ball.y<310){ if(ball.x<20){p2.score++; reset();} if(ball.x>740){p1.score++; reset();} }
            if(p1.score>=5||p2.score>=5){isOver=true; msg.innerText=(p1.score>=5?"파랑":"빨강")+" 승리!";}
        }
        ctx.fillStyle="#1a1a1a"; ctx.fillRect(0,0,760,460); ctx.strokeStyle="#333"; ctx.strokeRect(5,5,750,450);
        ctx.fillStyle="#3498db"; ctx.beginPath(); ctx.arc(p1.x,p1.y,p1.r,0,Math.PI*2); ctx.fill();
        ctx.fillStyle="#e74c3c"; ctx.beginPath(); ctx.arc(p2.x,p2.y,p2.r,0,Math.PI*2); ctx.fill();
        ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2); ctx.fill();
        requestAnimationFrame(loop);
    }
    function reset(){ ball.x=380;ball.y=230;ball.vx=0;ball.vy=0;p1.x=150;p1.y=230;p2.x=610;p2.y=230; p1s.innerText=p1.score; p2s.innerText=p2.score; }
    loop();
</script></body></html>
