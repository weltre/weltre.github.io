<!DOCTYPE html><html><head><meta charset="UTF-8"><title>땅따먹기 대결</title>
<style>
    :root { --bg: #1a1a1a; --p1: #3498db; --p2: #e74c3c; }
    body { background: var(--bg); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
    .status { display: flex; gap: 40px; background: #2d2d2d; padding: 15px 30px; border-radius: 12px; margin-bottom: 15px; }
    .player { display: flex; flex-direction: column; align-items: center; opacity: 0.3; transition: 0.3s; }
    .player.active { opacity: 1; transform: scale(1.1); }
    .score { font-size: 30px; font-weight: bold; }
    canvas { background: #e3c17a; border: 5px solid #34495e; border-radius: 8px; cursor: pointer; box-shadow: 0 10px 30px #000; }
    .info { margin-top: 10px; color: #aaa; font-size: 13px; text-align: center; }
</style></head><body>
<div class="status">
    <div id="p1-area" class="player" style="color:var(--p1)"><span>파랑(P1)</span><div id="p1-score" class="score">0</div></div>
    <div id="msg-area" style="text-align:center; min-width:120px; font-weight:bold;">차례: <span id="cur-turn">파랑</span></div>
    <div id="p2-area" class="player" style="color:var(--p2)"><span>빨강(P2)</span><div id="p2-score" class="score">0</div></div>
</div>
<canvas id="game" width="500" height="500"></canvas>
<div class="info">점과 점 사이를 클릭하여 선을 그으세요. 사각형을 완성하면 한 번 더!</div>
<button onclick="location.reload()" style="margin-top:15px; padding:8px 16px; cursor:pointer;">게임 재시작</button>

<script>
    const cvs = document.getElementById("game"), ctx = cvs.getContext("2d");
    const ROWS = 6, COLS = 6, SIZE = 80, OFFSET = 50;
    let turn = 1, p1Score = 0, p2Score = 0;
    let lines = [], boxes = [];

    // 초기화: 선(가로/세로) 및 박스 상태
    for(let i=0; i<=ROWS; i++) lines[i] = []; 
    for(let i=0; i<ROWS; i++) boxes[i] = [];

    canvasClick = (e) => {
        const rect = cvs.getBoundingClientRect(), x = e.clientX - rect.left - OFFSET, y = e.clientY - rect.top - OFFSET;
        let r = Math.round(y / SIZE), c = Math.round(x / SIZE);
        let dx = x - c * SIZE, dy = y - r * SIZE, hit = false, id = "";

        if (Math.abs(dx) > Math.abs(dy)) { // 가로선 시도
            let col = dx > 0 ? c : c - 1;
            if (r >= 0 && r <= ROWS && col >= 0 && col < COLS) {
                id = `h${r}${col}`;
                if (!lines.includes(id)) { lines.push(id); hit = true; }
            }
        } else { // 세로선 시도
            let row = dy > 0 ? r : r - 1;
            if (c >= 0 && c <= COLS && row >= 0 && row < ROWS) {
                id = `v${row}${c}`;
                if (!lines.includes(id)) { lines.push(id); hit = true; }
            }
        }

        if (hit) {
            let formed = checkSquare();
            if (!formed) turn = 3 - turn;
            updateUI();
        }
    };

    function checkSquare() {
        let newBox = false;
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (!boxes[r][c] && lines.includes(`h${r}${c}`) && lines.includes(`h${r+1}${c}`) && 
                    lines.includes(`v${r}${c}`) && lines.includes(`v${r}${c+1}`)) {
                    boxes[r][c] = turn;
                    if(turn === 1) p1Score++; else p2Score++;
                    newBox = true;
                }
            }
        }
        return newBox;
    }

    function render() {
        ctx.clearRect(0, 0, cvs.width, cvs.height);
        // 박스 색칠
        for(let r=0; r<ROWS; r++) for(let c=0; c<COLS; c++) {
            if(boxes[r][c]) {
                ctx.fillStyle = boxes[r][c] === 1 ? "rgba(52,152,219,0.3)" : "rgba(231,76,60,0.3)";
                ctx.fillRect(OFFSET + c*SIZE, OFFSET + r*SIZE, SIZE, SIZE);
            }
        }
        // 선 그리기
        ctx.lineWidth = 5; ctx.lineCap = "round";
        lines.forEach(id => {
            let type = id[0], r = parseInt(id[1]), c = parseInt(id[2]);
            ctx.strokeStyle = "#34495e";
            ctx.beginPath();
            if(type === 'h') { ctx.moveTo(OFFSET + c*SIZE, OFFSET + r*SIZE); ctx.lineTo(OFFSET + (c+1)*SIZE, OFFSET + r*SIZE); }
            else { ctx.moveTo(OFFSET + c*SIZE, OFFSET + r*SIZE); ctx.lineTo(OFFSET + c*SIZE, OFFSET + (r+1)*SIZE); }
            ctx.stroke();
        });
        // 점 그리기
        for(let r=0; r<=ROWS; r++) for(let c=0; c<=COLS; c++) {
            ctx.fillStyle = "#2c3e50"; ctx.beginPath();
            ctx.arc(OFFSET + c*SIZE, OFFSET + r*SIZE, 5, 0, Math.PI*2); ctx.fill();
        }
    }

    function updateUI() {
        document.getElementById('p1-score').innerText = p1Score;
        document.getElementById('p2-score').innerText = p2Score;
        document.getElementById('p1-area').classList.toggle('active', turn === 1);
        document.getElementById('p2-area').classList.toggle('active', turn === 2);
        document.getElementById('cur-turn').innerText = turn === 1 ? "파랑" : "빨강";
        render();
        if (p1Score + p2Score === ROWS * COLS) {
            let winText = p1Score > p2Score ? "파랑 승리!" : (p1Score < p2Score ? "빨강 승리!" : "무승부!");
            document.getElementById('msg-area').innerHTML = `<span style="color:#e74c3c">${winText}</span>`;
        }
    }

    cvs.onclick = canvasClick;
    updateUI();
</script></body></html>
