<!DOCTYPE html><html><head><meta charset="UTF-8"><title>땅따먹기</title>
<link rel="stylesheet" href="style.css"></head><body>
<div class="container">
    <div class="status-bar">
        <div id="p1-area" class="player" style="color:var(--p1)">파랑(P1)<div id="p1-s" style="font-size:30px">0</div></div>
        <div id="cur-turn" style="font-size:20px; min-width:150px;">파랑 차례</div>
        <div id="p2-area" class="player" style="color:var(--p2)">빨강(P2)<div id="p2-s" style="font-size:30px">0</div></div>
    </div>
    <canvas id="game" width="580" height="580"></canvas>
    <div style="margin-top:15px;"><button onclick="location.reload()">초기화</button> <button onclick="location.href='index.html'">목록으로</button></div>
</div>
<script>
    const cvs=document.getElementById("game"), ctx=cvs.getContext("2d");
    const ROWS=8, COLS=8, SIZE=60, OFFSET=50;
    let turn=1, p1S=0, p2S=0, lines=[], boxes=Array.from({length:8},()=>[]), lastL=null;
    cvs.onclick=(e)=>{
        const rect=cvs.getBoundingClientRect(), x=e.clientX-rect.left-OFFSET, y=e.clientY-rect.top-OFFSET;
        let r=Math.round(y/SIZE), c=Math.round(x/SIZE), dx=x-c*SIZE, dy=y-r*SIZE, hit=false, id="";
        if(Math.abs(dx)>Math.abs(dy)){
            let col=dx>0?c:c-1; if(r>=0&&r<=ROWS&&col>=0&&col<COLS){ id=`h${r}${col}`; if(!lines.find(l=>l.id===id)){lines.push({id, owner:turn}); hit=true;} }
        } else {
            let row=dy>0?r:r-1; if(c>=0&&c<=COLS&&row>=0&&row<ROWS){ id=`v${row}${c}`; if(!lines.find(l=>l.id===id)){lines.push({id, owner:turn}); hit=true;} }
        }
        if(hit){ lastL=id; if(!checkSq()) turn=3-turn; updateUI(); }
    };
    function checkSq(){
        let newB=false; const hasL=(id)=>lines.some(l=>l.id===id);
        for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
            if(!boxes[r][c]&&hasL(`h${r}${c}`)&&hasL(`h${r+1}${c}`)&&hasL(`v${r}${c}`)&&hasL(`v${r}${c+1}`)){
                boxes[r][c]=turn; if(turn===1)p1S++; else p2S++; newB=true;
            }
        } return newB;
    }
    function render(){
        ctx.clearRect(0,0,580,580); ctx.fillStyle="#e3c17a"; ctx.fillRect(0,0,580,580);
        for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) if(boxes[r][c]){ ctx.fillStyle=boxes[r][c]===1?"rgba(52,152,219,0.4)":"rgba(231,76,60,0.4)"; ctx.fillRect(OFFSET+c*SIZE,OFFSET+r*SIZE,SIZE,SIZE); }
        lines.forEach(l=>{
            let t=l.id[0], r_v=parseInt(l.id[1]), c_v=parseInt(l.id[2]);
            ctx.lineWidth=(l.id===lastL)?7:4; ctx.strokeStyle=l.owner===1?"#3498db":"#e74c3c";
            ctx.beginPath(); if(t==='h'){ctx.moveTo(OFFSET+c_v*SIZE,OFFSET+r_v*SIZE);ctx.lineTo(OFFSET+(c_v+1)*SIZE,OFFSET+r_v*SIZE);}
            else{ctx.moveTo(OFFSET+c_v*SIZE,OFFSET+r_v*SIZE);ctx.lineTo(OFFSET+c_v*SIZE,OFFSET+(r_v+1)*SIZE);} ctx.stroke();
        });
        for(let r=0;r<=ROWS;r++)for(let c=0;c<=COLS;c++){ ctx.fillStyle="#2c3e50"; ctx.beginPath(); ctx.arc(OFFSET+c*SIZE,OFFSET+r*SIZE,5,0,Math.PI*2); ctx.fill(); }
    }
    function updateUI(){
        document.getElementById('p1-s').innerText=p1S; document.getElementById('p2-s').innerText=p2S;
        document.getElementById('p1-area').classList.toggle('active',turn===1);
        document.getElementById('p2-area').classList.toggle('active',turn===2);
        const ct=document.getElementById('cur-turn'); ct.innerText=turn===1?"파랑 차례":"빨강 차례"; ct.style.color=turn===1?"#3498db":"#e74c3c";
        render(); if(p1S+p2S===64) ct.innerText=p1S>p2S?"파랑 승리!":"빨강 승리!";
    } updateUI();
</script></body></html>
