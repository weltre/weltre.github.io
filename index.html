<!DOCTYPE html><html><head><meta charset="UTF-8"><title>게임 스튜디오</title>
<link rel="stylesheet" href="style.css">
<style>
    .grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-top: 40px; }
    .game-card { 
        width: 230px; height: 180px; background: var(--card); border-radius: 12px; 
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-decoration: none; color: inherit; border: 3px solid #333; transition: 0.2s;
    }
    .game-card:hover { border-color: var(--accent); transform: translateY(-5px); }
    .icon { font-size: 50px; margin-bottom: 10px; }
    .title { font-size: 20px; font-weight: bold; }
</style></head><body>
<div class="container">
    <h1 style="font-size: 50px; color: var(--accent); margin-bottom: 0;">GAME STUDIO</h1>
    <p style="color: #666;">😁 로컬 2인 플레이 최적화</p>
    <div class="grid">
        <a href="omok.html" class="game-card"><span class="icon">⚫</span><span class="title">오목 & 오셀로</span></a>
        <a href="pong.html" class="game-card"><span class="icon">🏓</span><span class="title">클래식 퐁</span></a>
        <a href="dots.html" class="game-card"><span class="icon">🟩</span><span class="title">땅따먹기</span></a>
        <a href="tank.html" class="game-card"><span class="icon">🚀</span><span class="title">탱크 대전</span></a>
        <a href="soccer.html" class="game-card"><span class="icon">⚽</span><span class="title">파워 사커</span></a>
    </div>
</div></body></html>
